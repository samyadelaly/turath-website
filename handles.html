<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0A0A0A">
  <title>Handles Collection — TURATH</title>
  <meta name="description" content="Explore our handcrafted architectural solid brass handles and bespoke door hardware made in Cairo, Egypt.">

  <!-- Open Graph / Facebook / WhatsApp -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://turath-egypt.com/handles.html">
  <meta property="og:title" content="Handles Collection — TURATH">
  <meta property="og:description" content="Handcrafted solid brass handles, sculptural door pulls, and architectural hardware. Egyptian metal manufacturing.">
  <meta property="og:image" content="/assets/images/handles/handle-01.jpg">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Inter:wght@400;500;600;700;800;900&family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=Space+Mono:wght@700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <link rel="stylesheet" href="./src/style.css">
</head>
<body class="bg-[#050505] text-white antialiased overflow-hidden selection:bg-[#D7C797] selection:text-black">

  <main class="min-h-screen bg-[#050505] text-white overflow-hidden">
    <div class="relative w-full h-[100dvh] md:h-[90vh] md:aspect-[9/16] md:mx-auto bg-black">
      
      <!-- Top Navbar -->
      <div class="absolute top-0 left-0 w-full p-6 md:p-10 flex items-center justify-between z-50 bg-gradient-to-b from-black/80 via-black/40 to-transparent">
        <a href="index.html#gallery" class="text-white text-3xl font-light hover:opacity-70 transition-opacity cursor-pointer leading-none" aria-label="Back to Collections">&larr;</a>
        <button id="share-btn" type="button" class="absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 w-6 h-6 text-white/70 hover:text-white transition-colors cursor-pointer pointer-events-auto" aria-label="Share">
          <svg class="w-5 h-5 mx-auto" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M7.217 10.907a2.25 2.25 0 100 2.186m0-2.186c.18.324.283.696.283 1.093s-.103.77-.283 1.093m0-2.186l9.566-5.314m-9.566 7.5l9.566 5.314m0 0a2.25 2.25 0 103.935 2.186 2.25 2.25 0 00-3.935-2.186zm0-12.814a2.25 2.25 0 103.933-2.185 2.25 2.25 0 00-3.933 2.185z" /></svg>
        </button>
        <span class="text-xs md:text-sm font-light tracking-[0.3em] uppercase text-white/70">HANDLES</span>
      </div>

      <!-- Centered Product Title -->
      <div class="absolute top-[15%] md:top-[20%] left-0 w-full flex justify-center items-center z-40 px-4 pointer-events-none">
        <h1 id="slider-title" class="text-lg md:text-xl lg:text-2xl font-bold tracking-[0.2em] text-white uppercase text-center drop-shadow-md">
          CIRCULAR COBBLESTONE BRASS DOOR PULLS
        </h1>
      </div>

      <!-- Center Navigation Arrows -->
      <div class="absolute top-1/2 left-0 w-full -translate-y-1/2 flex justify-between items-center px-4 md:px-6 z-40 pointer-events-none">
        <button id="prev-btn" class="text-white/60 hover:text-white text-3xl md:text-4xl font-light transition-colors pointer-events-auto cursor-pointer" aria-label="Previous Image">&larr;</button>
        <button id="next-btn" class="text-white/60 hover:text-white text-3xl md:text-4xl font-light transition-colors pointer-events-auto cursor-pointer" aria-label="Next Image">&rarr;</button>
      </div>

      <!-- Main Product Image -->
      <img id="slider-image" src="/assets/images/handles/circular-cobblestone-brass-door-pulls.jpg" alt="CIRCULAR COBBLESTONE BRASS DOOR PULLS" class="w-full h-full object-cover transition-opacity duration-300">
      
      <!-- Bottom Overlay: AI Description & Dashes -->
      <div class="absolute bottom-0 left-0 w-full p-6 pb-10 bg-gradient-to-t from-black/95 via-black/60 to-transparent z-50 flex flex-col items-center gap-6">
        <p id="slider-desc" class="text-white/90 text-sm md:text-base font-light tracking-wide text-center max-w-md drop-shadow-md leading-relaxed min-h-[3rem]">
          A monumental pair of semicircular entry door handles cast in solid brass, featuring deep organic cobblestone relief texturing.
        </p>
        <div id="dashes-container" class="flex justify-center items-center gap-2 sm:gap-2.5 w-full max-w-xs sm:max-w-sm px-4 overflow-hidden"></div>
      </div>
    </div>
  </main>

  <script>
    const sliderData = [
      {
            "src": "/assets/images/handles/circular-cobblestone-brass-door-pulls.jpg",
            "title": "CIRCULAR COBBLESTONE BRASS DOOR PULLS",
            "desc": "A monumental pair of semicircular entry door handles cast in solid brass, featuring deep organic cobblestone relief texturing."
      },
      {
            "src": "/assets/images/handles/hammered-honeycomb-brass-pull.jpg",
            "title": "HAMMERED HONEYCOMB BRASS PULL",
            "desc": "A rectilinear architectural door pull in solid brass with beveled perimeter borders framing a densely hand-hammered honeycomb textural core."
      },
      {
            "src": "/assets/images/handles/sculptural-fluid-magma-brass-pull.jpg",
            "title": "SCULPTURAL FLUID MAGMA BRASS PULL",
            "desc": "A monumental full-height architectural door pull hand-cast in solid brass, capturing liquid ripples and dynamic molten geological flows."
      },
      {
            "src": "/assets/images/handles/pair-cast-brass-branch-pulls.jpg",
            "title": "PAIR CAST BRASS BRANCH PULLS",
            "desc": "A dramatic pair of branching solid brass door handles engineered for grand double doors and luxury entranceways."
      },
      {
            "src": "/assets/images/handles/minimalist-tbar-escutcheon-pull.jpg",
            "title": "MINIMALIST T-BAR ESCUTCHEON PULL",
            "desc": "A precision-machined solid brass T-bar handle mounted to a softly radiused square backplate escutcheon in polished golden brass."
      },
      {
            "src": "/assets/images/handles/handle-01.jpg",
            "title": "ORGANIC BOUGH DOOR PULL",
            "desc": "A monumental entrance door pull hand-cast in solid brass, echoing the graceful form of an outstretched tree bough."
      },
      {
            "src": "/assets/images/handles/handle-02.jpg",
            "title": "TOPOGRAPHIC BRUTALIST HANDLES",
            "desc": "A sculptural pair of semicircular door pulls featuring deep molten brass casting and rich tactile topography."
      },
      {
            "src": "/assets/images/handles/handle-03.jpg",
            "title": "SCULPTED TWIG VERTICAL PULL",
            "desc": "An elongated solid brass architectural pull with undulating organic contours and hand-finished bronze undertones."
      },
      {
            "src": "/assets/images/handles/handle-04.jpg",
            "title": "SYMMETRIC BRANCH PULL PAIR",
            "desc": "A dramatic pair of branching solid brass door handles engineered for grand double doors and luxury entranceways."
      }
];

    let currentIndex = 0;
    const titleEl = document.getElementById('slider-title');
    const descEl = document.getElementById('slider-desc');
    const imgEl = document.getElementById('slider-image');
    const dashesContainer = document.getElementById('dashes-container');
    const prevBtn = document.getElementById('prev-btn');
    const nextBtn = document.getElementById('next-btn');

    // Build Dash indicators dynamically
    sliderData.forEach((_, idx) => {
      const dash = document.createElement('span');
      dash.className = `dash-dot flex-1 max-w-[28px] min-w-[8px] h-[2px] rounded-full transition-all duration-300 cursor-pointer ${idx === 0 ? 'bg-white' : 'bg-white/30'}`;
      dash.addEventListener('click', () => updateSlider(idx));
      dashesContainer.appendChild(dash);
    });

    function updateSlider(index) {
      if (index < 0) {
        currentIndex = sliderData.length - 1;
      } else if (index >= sliderData.length) {
        currentIndex = 0;
      } else {
        currentIndex = index;
      }

      // Smooth crossfade
      imgEl.style.opacity = '0.3';
      titleEl.style.opacity = '0.3';
      descEl.style.opacity = '0.3';

      setTimeout(() => {
        imgEl.src = sliderData[currentIndex].src;
        imgEl.alt = sliderData[currentIndex].title;
        titleEl.innerText = sliderData[currentIndex].title;
        descEl.innerText = sliderData[currentIndex].desc;

        imgEl.style.opacity = '1';
        titleEl.style.opacity = '1';
        descEl.style.opacity = '1';

        // Update dashes
        const dots = dashesContainer.querySelectorAll('.dash-dot');
        dots.forEach((dot, idx) => {
          if (idx === currentIndex) {
            dot.classList.remove('bg-white/30');
            dot.classList.add('bg-white');
          } else {
            dot.classList.remove('bg-white');
            dot.classList.add('bg-white/30');
          }
        });
      }, 150);
    }

    if (prevBtn) {
      prevBtn.addEventListener('click', () => updateSlider(currentIndex - 1));
    }
    if (nextBtn) {
      nextBtn.addEventListener('click', () => updateSlider(currentIndex + 1));
    }

    // Keyboard navigation
    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowLeft') updateSlider(currentIndex - 1);
      if (e.key === 'ArrowRight') updateSlider(currentIndex + 1);
    });

    // Touch swipe support
    let touchStartX = 0;
    let touchEndX = 0;
    const container = document.querySelector('main');

    if (container) {
      container.addEventListener('touchstart', (e) => {
        touchStartX = e.changedTouches[0].screenX;
      }, { passive: true });

      container.addEventListener('touchend', (e) => {
        touchEndX = e.changedTouches[0].screenX;
        const diff = touchEndX - touchStartX;
        if (Math.abs(diff) > 40) {
          if (diff < 0) {
            updateSlider(currentIndex + 1);
          } else {
            updateSlider(currentIndex - 1);
          }
        }
      }, { passive: true });
    }
  
    // Share button interaction
    const shareBtn = document.getElementById('share-btn');
    if (shareBtn) {
      shareBtn.addEventListener('click', async () => {
        const title = (typeof titleEl !== 'undefined' && titleEl) ? titleEl.innerText : document.title;
        const url = window.location.href;
        if (navigator.share) {
          try {
            await navigator.share({ title: title, url: url });
          } catch (err) {}
        } else if (navigator.clipboard) {
          await navigator.clipboard.writeText(url);
          shareBtn.classList.add('text-[#D7C797]');
          setTimeout(() => shareBtn.classList.remove('text-[#D7C797]'), 1500);
        }
      });
    }

  </script>

</body>
</html>
