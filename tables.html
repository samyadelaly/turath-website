<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0A0A0A">
  <title>Tables & Consoles Collection — TURATH</title>
  <meta name="description" content="Explore our handcrafted solid brass and copper tables and consoles made in Cairo, Egypt.">

  <!-- Open Graph / Facebook / WhatsApp -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://turath-egypt.com/tables.html">
  <meta property="og:title" content="Tables & Consoles Collection — TURATH">
  <meta property="og:description" content="Handcrafted solid brass and copper tables and luxury consoles. Egyptian artisan metal furniture manufacturing.">
  <meta property="og:image" content="/assets/images/tables/table-01.jpg">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Inter:wght@400;500;600;700;800;900&family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=Space+Mono:wght@700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <link rel="stylesheet" href="./src/style.css">
</head>
<body class="bg-[#050505] text-white antialiased overflow-hidden selection:bg-[#D7C797] selection:text-black">

  <main class="min-h-screen bg-[#050505] text-white overflow-hidden">
    <div class="relative w-full h-[100dvh] md:h-[90vh] md:aspect-[9/16] md:mx-auto bg-black">
      
      <!-- Top Navbar -->
      <div class="absolute top-0 left-0 w-full p-6 md:p-10 flex items-center justify-between z-50 bg-gradient-to-b from-black/80 via-black/40 to-transparent">
        <a href="index.html#scene-03" class="text-white text-3xl font-light hover:opacity-70 transition-opacity cursor-pointer leading-none" aria-label="Back to Collections">&larr;</a>
        <span class="text-xs md:text-sm font-light tracking-[0.3em] uppercase text-white/70">TABLES & CONSOLES</span>
      </div>

      <!-- Centered Product Title -->
      <div class="absolute top-[15%] md:top-[20%] left-0 w-full flex justify-center items-center z-40 px-4 pointer-events-none">
        <h1 id="slider-title" class="text-lg md:text-xl lg:text-2xl font-bold tracking-[0.2em] text-white uppercase text-center drop-shadow-md">
          STAGGERED BRASS PLATE CYLINDER TABLE
        </h1>
      </div>

      <!-- Center Navigation Arrows -->
      <div class="absolute top-1/2 left-0 w-full -translate-y-1/2 flex justify-between items-center px-4 md:px-6 z-40 pointer-events-none">
        <button id="prev-btn" class="text-white/60 hover:text-white text-3xl md:text-4xl font-light transition-colors pointer-events-auto cursor-pointer" aria-label="Previous Image">&larr;</button>
        <button id="next-btn" class="text-white/60 hover:text-white text-3xl md:text-4xl font-light transition-colors pointer-events-auto cursor-pointer" aria-label="Next Image">&rarr;</button>
      </div>

      <!-- Main Product Image -->
      <img id="slider-image" src="/assets/images/tables/staggered-brass-plate-cylinder-table.jpg" alt="STAGGERED BRASS PLATE CYLINDER TABLE" class="w-full h-full object-cover transition-opacity duration-300">
      
      <!-- Bottom Overlay: AI Description & Dashes -->
      <div class="absolute bottom-0 left-0 w-full p-6 pb-10 bg-gradient-to-t from-black/95 via-black/60 to-transparent z-50 flex flex-col items-center gap-6">
        <p id="slider-desc" class="text-white/90 text-sm md:text-base font-light tracking-wide text-center max-w-md drop-shadow-md leading-relaxed min-h-[3rem]">
          A sculptural drum side table featuring a clear glass top supported by an architectural cylinder of vertical brass rods and staggered patinated rectangular plates.
        </p>
        <div id="dashes-container" class="flex justify-center items-center gap-2 sm:gap-2.5 w-full max-w-xs sm:max-w-sm px-4 overflow-hidden"></div>
      </div>
    </div>
  </main>

  <script>
    const sliderData = [
      {
            "src": "/assets/images/tables/staggered-brass-plate-cylinder-table.jpg",
            "title": "STAGGERED BRASS PLATE CYLINDER TABLE",
            "desc": "A sculptural drum side table featuring a clear glass top supported by an architectural cylinder of vertical brass rods and staggered patinated rectangular plates."
      },
      {
            "src": "/assets/images/tables/tiered-brass-tubular-nesting-tables.jpg",
            "title": "TIERED BRASS TUBULAR NESTING TABLES",
            "desc": "A refined pair of tiered accent drink tables with clear glass tops supported by slender brushed solid brass columns and architectural tiered cross stretchers."
      },
      {
            "src": "/assets/images/tables/nesting-circular-brass-coffee-tables.jpg",
            "title": "NESTING BRASS COFFEE TABLES",
            "desc": "A sophisticated duo of nesting circular coffee tables featuring inset glass tops, slender triple-rod brass pillars, and continuous circular ground rings."
      },
      {
            "src": "/assets/images/tables/geometric-brass-x-base-tufted-bench.jpg",
            "title": "GEOMETRIC BRASS X-BASE TUFTED BENCH",
            "desc": "A luxurious console bench combining a deeply tufted charcoal velvet cushion with an architectural geometric solid brass X-frame trestle base."
      },
      {
            "src": "/assets/images/tables/table-01.jpg",
            "title": "ORGANIC BRANCH BRASS CONSOLE",
            "desc": "A sculptural console base handcrafted in solid brass casting, capturing the organic silhouette of intertwining natural branches."
      },
      {
            "src": "/assets/images/tables/table-02.jpg",
            "title": "BRANCH LEG ARTISAN CONSOLE",
            "desc": "Sleek dark timber console elevated by hand-cast solid brass branch legs featuring tactile textured detailing."
      },
      {
            "src": "/assets/images/tables/table-03.jpg",
            "title": "FLUTED BRASS MARBLE GUÉRIDON",
            "desc": "An elegant side table featuring Italian veined marble supported by slender fluted brass columns and tripod footing."
      },
      {
            "src": "/assets/images/tables/table-04.jpg",
            "title": "BRUTALIST BRASS DRUM TABLE",
            "desc": "A circular coffee table with tempered glass resting on a hand-welded cylindrical cage of aged brass panels."
      },
      {
            "src": "/assets/images/tables/table-05.jpg",
            "title": "FLUTED COLUMN BRASS CONSOLE",
            "desc": "Nero Marquina marble console anchored by architectural fluted brass uprights mounted to a solid polished plinth."
      }
];

    let currentIndex = 0;
    const titleEl = document.getElementById('slider-title');
    const descEl = document.getElementById('slider-desc');
    const imgEl = document.getElementById('slider-image');
    const dashesContainer = document.getElementById('dashes-container');
    const prevBtn = document.getElementById('prev-btn');
    const nextBtn = document.getElementById('next-btn');

    // Build Dash indicators dynamically
    sliderData.forEach((_, idx) => {
      const dash = document.createElement('span');
      dash.className = `dash-dot flex-1 max-w-[28px] min-w-[8px] h-[2px] rounded-full transition-all duration-300 cursor-pointer ${idx === 0 ? 'bg-white' : 'bg-white/30'}`;
      dash.addEventListener('click', () => updateSlider(idx));
      dashesContainer.appendChild(dash);
    });

    function updateSlider(index) {
      if (index < 0) {
        currentIndex = sliderData.length - 1;
      } else if (index >= sliderData.length) {
        currentIndex = 0;
      } else {
        currentIndex = index;
      }

      // Smooth crossfade
      imgEl.style.opacity = '0.3';
      titleEl.style.opacity = '0.3';
      descEl.style.opacity = '0.3';

      setTimeout(() => {
        imgEl.src = sliderData[currentIndex].src;
        imgEl.alt = sliderData[currentIndex].title;
        titleEl.innerText = sliderData[currentIndex].title;
        descEl.innerText = sliderData[currentIndex].desc;

        imgEl.style.opacity = '1';
        titleEl.style.opacity = '1';
        descEl.style.opacity = '1';

        // Update dashes
        const dots = dashesContainer.querySelectorAll('.dash-dot');
        dots.forEach((dot, idx) => {
          if (idx === currentIndex) {
            dot.classList.remove('bg-white/30');
            dot.classList.add('bg-white');
          } else {
            dot.classList.remove('bg-white');
            dot.classList.add('bg-white/30');
          }
        });
      }, 150);
    }

    if (prevBtn) {
      prevBtn.addEventListener('click', () => updateSlider(currentIndex - 1));
    }
    if (nextBtn) {
      nextBtn.addEventListener('click', () => updateSlider(currentIndex + 1));
    }

    // Keyboard navigation
    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowLeft') updateSlider(currentIndex - 1);
      if (e.key === 'ArrowRight') updateSlider(currentIndex + 1);
    });

    // Touch swipe support
    let touchStartX = 0;
    let touchEndX = 0;
    const container = document.querySelector('main');

    if (container) {
      container.addEventListener('touchstart', (e) => {
        touchStartX = e.changedTouches[0].screenX;
      }, { passive: true });

      container.addEventListener('touchend', (e) => {
        touchEndX = e.changedTouches[0].screenX;
        const diff = touchEndX - touchStartX;
        if (Math.abs(diff) > 40) {
          if (diff < 0) {
            updateSlider(currentIndex + 1);
          } else {
            updateSlider(currentIndex - 1);
          }
        }
      }, { passive: true });
    }
  </script>

</body>
</html>
