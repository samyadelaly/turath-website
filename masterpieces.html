<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0A0A0A">
  <title>Featured Masterpieces | Turath Egypt</title>
  <meta name="description" content="Explore our most requested best-selling bespoke brass and copper creations made in Cairo, Egypt.">

  <!-- Open Graph / Facebook / WhatsApp -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://turath-egypt.com/masterpieces.html">
  <meta property="og:title" content="Featured Masterpieces | Turath Egypt">
  <meta property="og:description" content="Explore our most requested best-selling bespoke brass and copper creations. Egyptian luxury metal manufacturing.">
  <meta property="og:image" content="/assets/images/masterpieces/sculptural-brass-branch-console.jpg">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Inter:wght@400;500;600;700;800;900&family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=Space+Mono:wght@700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <link rel="stylesheet" href="./src/style.css">
</head>
<body class="bg-[#050505] text-white antialiased overflow-hidden selection:bg-[#D7C797] selection:text-black">

  <main class="min-h-screen bg-[#050505] text-white overflow-hidden">
    <!-- Slider View Container (Matching mirrors.html and the 9 sub-pages) -->
    <div id="slider-view" class="relative w-full h-[100dvh] md:h-[90vh] md:aspect-[9/16] md:mx-auto bg-black overflow-hidden">
      
      <!-- Top Navbar with Back Link to Scene 05 -->
      <div class="absolute top-0 left-0 w-full p-6 md:p-10 flex items-center justify-between z-50 bg-gradient-to-b from-black/80 via-black/40 to-transparent">
        <a href="index.html#scene-05" class="text-white text-3xl font-light hover:opacity-70 transition-opacity cursor-pointer leading-none" aria-label="Back to Featured Masterpieces">&larr;</a>
        <span class="text-xs md:text-sm font-light tracking-[0.3em] uppercase text-white/70">MASTERPIECES</span>
      </div>

      <!-- Main Page Heading & Sub-text (Matching OUR VISION Typography Standards) -->
      <div class="absolute top-[12%] md:top-[16%] left-0 w-full flex flex-col justify-center items-center z-40 px-4 pointer-events-none text-center">
        <h1 id="slider-title" class="hero-bottom-title about-title text-lg md:text-xl lg:text-2xl font-bold tracking-tight text-white uppercase text-center drop-shadow-md mb-1">
          FEATURED MASTERPIECES
        </h1>
        <p class="text-xs md:text-sm text-white/80 font-light tracking-wide max-w-md text-center drop-shadow">
          Explore our most requested best-selling bespoke brass and copper creations.
        </p>
      </div>

      <!-- Center Navigation Arrows -->
      <div class="absolute top-1/2 left-0 w-full -translate-y-1/2 flex justify-between items-center px-4 md:px-6 z-40 pointer-events-none">
        <button id="prev-btn" class="text-white/60 hover:text-white text-3xl md:text-4xl font-light transition-colors pointer-events-auto cursor-pointer" aria-label="Previous Image">&larr;</button>
        <button id="next-btn" class="text-white/60 hover:text-white text-3xl md:text-4xl font-light transition-colors pointer-events-auto cursor-pointer" aria-label="Next Image">&rarr;</button>
      </div>

      <!-- Main Product Image -->
      <img id="slider-image" src="/assets/images/masterpieces/sculptural-brass-branch-console.jpg" alt="Sculptural Cast Brass Branch Console" class="w-full h-full object-cover transition-opacity duration-300">
      
      <!-- Bottom Overlay: Description & Dashes -->
      <div class="absolute bottom-0 left-0 w-full p-6 pb-10 bg-gradient-to-t from-black/95 via-black/60 to-transparent z-50 flex flex-col items-center gap-6">
        <div class="text-center">
          <h2 id="product-name" class="text-sm md:text-base font-semibold tracking-wider text-[#D7C797] uppercase mb-1">
            SCULPTURAL CAST BRASS BRANCH CONSOLE
          </h2>
          <p id="slider-desc" class="text-white/90 text-xs md:text-sm font-light tracking-wide text-center max-w-md drop-shadow-md leading-relaxed min-h-[2.5rem]">
            A signature architectural console table featuring organic cast solid brass branch structure supporting a hand-honed black marble slab.
          </p>
        </div>
        <div id="dashes-container" class="flex justify-center items-center gap-2 sm:gap-3 flex-wrap">
          <!-- Populated dynamically by script -->
        </div>
      </div>
    </div>
  </main>

  <script>
    const masterpiecesData = [
      {
        src: '/assets/images/masterpieces/sculptural-brass-branch-console.jpg',
        title: 'SCULPTURAL CAST BRASS BRANCH CONSOLE',
        desc: 'A signature architectural console table featuring organic cast solid brass branch structure supporting a hand-honed black marble slab.'
      },
      {
        src: '/assets/images/masterpieces/organic-cast-brass-web-mirror.jpg',
        title: 'ORGANIC CAST BRASS WEB MIRROR',
        desc: 'A sculptural circular wall mirror framed by hand-cast solid brass branch web motifs with polished artisanal luster.'
      },
      {
        src: '/assets/images/masterpieces/filigree-brass-floral-mirror.jpg',
        title: 'FILIGREE BRASS SCROLLWORK MIRROR',
        desc: 'A monumental circular mirror enveloped in multi-layered solid brass petals embellished with delicate hand-spun wire filigree scrollwork.'
      },
      {
        src: '/assets/images/masterpieces/radiant-brass-sunburst-mirror.jpg',
        title: 'RADIANT BRASS SUNBURST BRANCH MIRROR',
        desc: 'A statement sunburst wall mirror featuring hand-forged solid brass branches radiating with sculptural architectural energy.'
      },
      {
        src: '/assets/images/masterpieces/studded-brass-halo-mirror.jpg',
        title: 'STUDDED BRASS PIN HALO MIRROR',
        desc: 'A monumental circular wall mirror surrounded by concentric radial rows of hand-turned solid brass pins, creating a hypnotic textural halo.'
      },
      {
        src: '/assets/images/masterpieces/pair-cast-brass-branch-handles.jpg',
        title: 'PAIR CAST BRASS BRANCH PULLS',
        desc: 'A magnificent pair of monumental architectural door handles cast in solid brass, echoing natural organic tree branches.'
      },
      {
        src: '/assets/images/masterpieces/hammered-brass-curved-applique.jpg',
        title: 'HAMMERED BRASS CYLINDER APPLIQUE',
        desc: 'An architectural wall sconce hand-hammered from solid brass sheet with overlapping curve geometry, diffusing a warm golden ambiance.'
      },
      {
        src: '/assets/images/masterpieces/sculptural-cast-brass-bookends.jpg',
        title: 'SCULPTURAL CAST BRASS BOOKENDS',
        desc: 'A pair of heavy solid brass sculptural bookends featuring deep fluid ripples and organic geological texturing.'
      },
      {
        src: '/assets/images/masterpieces/sculptural-brass-branch-handle.jpg',
        title: 'SCULPTURAL CAST BRASS BRANCH HANDLE',
        desc: 'An architectural statement door pull hand-cast in solid brass with natural tree branch contours and hand-finished warm patina.'
      }
    ];

    let currentIndex = 0;
    const imgEl = document.getElementById('slider-image');
    const productNameEl = document.getElementById('product-name');
    const descEl = document.getElementById('slider-desc');
    const dashesContainer = document.getElementById('dashes-container');
    const prevBtn = document.getElementById('prev-btn');
    const nextBtn = document.getElementById('next-btn');

    // Build Dash indicators
    masterpiecesData.forEach((_, idx) => {
      const dash = document.createElement('span');
      dash.className = `dash-dot w-6 sm:w-8 h-[2px] rounded-full transition-all duration-300 cursor-pointer ${idx === 0 ? 'bg-white' : 'bg-white/30'}`;
      dash.addEventListener('click', () => updateSlider(idx));
      dashesContainer.appendChild(dash);
    });

    function updateSlider(index) {
      if (index < 0) {
        currentIndex = masterpiecesData.length - 1;
      } else if (index >= masterpiecesData.length) {
        currentIndex = 0;
      } else {
        currentIndex = index;
      }

      // Smooth crossfade
      imgEl.style.opacity = '0.3';
      if (productNameEl) productNameEl.style.opacity = '0.3';
      descEl.style.opacity = '0.3';

      setTimeout(() => {
        imgEl.src = masterpiecesData[currentIndex].src;
        if (productNameEl) productNameEl.innerText = masterpiecesData[currentIndex].title;
        descEl.innerText = masterpiecesData[currentIndex].desc;

        imgEl.style.opacity = '1';
        if (productNameEl) productNameEl.style.opacity = '1';
        descEl.style.opacity = '1';

        // Update active dash
        const dashes = dashesContainer.querySelectorAll('.dash-dot');
        dashes.forEach((dash, i) => {
          if (i === currentIndex) {
            dash.classList.remove('bg-white/30');
            dash.classList.add('bg-white');
          } else {
            dash.classList.remove('bg-white');
            dash.classList.add('bg-white/30');
          }
        });
      }, 150);
    }

    if (prevBtn) prevBtn.addEventListener('click', () => updateSlider(currentIndex - 1));
    if (nextBtn) nextBtn.addEventListener('click', () => updateSlider(currentIndex + 1));

    // Keyboard navigation
    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowLeft') updateSlider(currentIndex - 1);
      if (e.key === 'ArrowRight') updateSlider(currentIndex + 1);
    });

    // Touch swipe support for mobile
    let touchStartX = 0;
    let touchEndX = 0;
    const container = document.querySelector('main');

    if (container) {
      container.addEventListener('touchstart', (e) => {
        touchStartX = e.changedTouches[0].screenX;
      }, { passive: true });

      container.addEventListener('touchend', (e) => {
        touchEndX = e.changedTouches[0].screenX;
        const diff = touchEndX - touchStartX;
        if (Math.abs(diff) > 40) {
          if (diff < 0) {
            updateSlider(currentIndex + 1);
          } else {
            updateSlider(currentIndex - 1);
          }
        }
      }, { passive: true });
    }
  </script>
</body>
</html>
