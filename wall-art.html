<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0A0A0A">
  <title>Brass & Copper Wall Art Collection — TURATH</title>
  <meta name="description" content="Explore our handcrafted solid brass and copper wall art, architectural relief panels, and bespoke metal cladding made in Cairo, Egypt.">

  <!-- Open Graph / Facebook / WhatsApp -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://turath-egypt.com/wall-art.html">
  <meta property="og:title" content="Brass & Copper Wall Art Collection — TURATH">
  <meta property="og:description" content="Handcrafted solid brass and copper sculptural wall art, repoussé panels, and bespoke murals. Egyptian metal manufacturing.">
  <meta property="og:image" content="/assets/images/wall-art/sculptural-botanical-urn-brass-relief.jpg">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Inter:wght@400;500;600;700;800;900&family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=Space+Mono:wght@700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <link rel="stylesheet" href="./src/style.css">
</head>
<body class="bg-[#050505] text-white antialiased overflow-hidden selection:bg-[#D7C797] selection:text-black">

  <main class="min-h-screen bg-[#050505] text-white overflow-hidden">
    <div class="relative w-full h-[100dvh] md:h-[90vh] md:aspect-[9/16] md:mx-auto bg-black">
      
      <!-- Top Navbar -->
      <div class="absolute top-0 left-0 w-full p-6 md:p-10 flex items-center justify-between z-50 bg-gradient-to-b from-black/80 via-black/40 to-transparent">
        <a href="index.html#scene-03" class="text-white text-3xl font-light hover:opacity-70 transition-opacity cursor-pointer leading-none" aria-label="Back to Collections">&larr;</a>
        <span class="text-xs md:text-sm font-light tracking-[0.3em] uppercase text-white/70">WALL ART</span>
      </div>

      <!-- Centered Product Title -->
      <div class="absolute top-[15%] md:top-[20%] left-0 w-full flex justify-center items-center z-40 px-4 pointer-events-none">
        <h1 id="slider-title" class="text-lg md:text-xl lg:text-2xl font-bold tracking-[0.2em] text-white uppercase text-center drop-shadow-md">
          SCULPTURAL BOTANICAL URN BRASS RELIEF
        </h1>
      </div>

      <!-- Center Navigation Arrows -->
      <div class="absolute top-1/2 left-0 w-full -translate-y-1/2 flex justify-between items-center px-4 md:px-6 z-40 pointer-events-none">
        <button id="prev-btn" class="text-white/60 hover:text-white text-3xl md:text-4xl font-light transition-colors pointer-events-auto cursor-pointer" aria-label="Previous Image">&larr;</button>
        <button id="next-btn" class="text-white/60 hover:text-white text-3xl md:text-4xl font-light transition-colors pointer-events-auto cursor-pointer" aria-label="Next Image">&rarr;</button>
      </div>

      <!-- Main Product Image -->
      <img id="slider-image" src="/assets/images/wall-art/sculptural-botanical-urn-brass-relief.jpg" alt="SCULPTURAL BOTANICAL URN BRASS RELIEF" class="w-full h-full object-cover transition-opacity duration-300">
      
      <!-- Bottom Overlay: AI Description & Dashes -->
      <div class="absolute bottom-0 left-0 w-full p-6 pb-10 bg-gradient-to-t from-black/95 via-black/60 to-transparent z-50 flex flex-col items-center gap-6">
        <p id="slider-desc" class="text-white/90 text-sm md:text-base font-light tracking-wide text-center max-w-md drop-shadow-md leading-relaxed min-h-[3rem]">
          A monumental sculptural brass wall plaque featuring an opulent bouquet of dimensional botanical foliage and blooming flora emerging from a hand-textured vase.
        </p>
        <div id="dashes-container" class="flex justify-center items-center gap-2 sm:gap-2.5 w-full max-w-xs sm:max-w-sm px-4 overflow-hidden"></div>
      </div>
    </div>
  </main>

  <script>
    const sliderData = [
      {
        src: '/assets/images/wall-art/sculptural-botanical-urn-brass-relief.jpg',
        title: 'SCULPTURAL BOTANICAL URN BRASS RELIEF',
        desc: 'A monumental sculptural brass wall plaque featuring an opulent bouquet of dimensional botanical foliage and blooming flora emerging from a hand-textured vase.'
      },
      {
        src: '/assets/images/wall-art/soaring-crane-oval-brass-relief.jpg',
        title: 'SOARING CRANE OVAL BRASS RELIEF',
        desc: 'An oval solid brass sculptural relief panel depicting a graceful crane in flight among stylized swirling clouds and flowing waters beneath a celestial sun.'
      },
      {
        src: '/assets/images/wall-art/tri-color-filigree-leaf-wall-sculptures.jpg',
        title: 'TRI-COLOR FILIGREE LEAF WALL SCULPTURES',
        desc: 'A dynamic triptych of sculptural openwork leaves crafted in three distinct finishes—golden brass, warm copper, and silvered bronze—casting intricate shadows.'
      },
      {
        src: '/assets/images/wall-art/wall-art-01.jpg',
        title: 'OPENWORK LEAF BRASS PANEL',
        desc: 'A tall architectural brass screen featuring pierced organic leaf venation cast with delicate sculptural permeability.'
      },
      {
        src: '/assets/images/wall-art/wall-art-02.jpg',
        title: 'REPOUSSÉ BRASS MEDALLION PANEL',
        desc: 'An embossed solid brass architectural wall panel celebrating classical spiral rosettes and relief rope-twist borders.'
      },
      {
        src: '/assets/images/wall-art/wall-art-03.jpg',
        title: 'PORTORO MARBLE & BRASS HEARTH',
        desc: 'A monumental fireplace surround in black gold marble framed by artisan hammered brass medallion relief friezes.'
      },
      {
        src: '/assets/images/wall-art/wall-art-04.jpg',
        title: 'BOTANICAL BRANCH BRASS RELIEF',
        desc: 'A framed high-relief wall artwork crafted with hand-chased brass foliage radiating from an articulated central branch.'
      },
      {
        src: '/assets/images/wall-art/wall-art-05.jpg',
        title: 'FOLKLORIC COPPER BAS-RELIEF',
        desc: 'A narrative hammered copper mural depicting folkloric maritime and nature motifs with an authentic antique patina.'
      }
    ];

    let currentIndex = 0;
    const titleEl = document.getElementById('slider-title');
    const descEl = document.getElementById('slider-desc');
    const imgEl = document.getElementById('slider-image');
    const dashesContainer = document.getElementById('dashes-container');
    const prevBtn = document.getElementById('prev-btn');
    const nextBtn = document.getElementById('next-btn');

    // Build Dash indicators dynamically
    sliderData.forEach((_, idx) => {
      const dash = document.createElement('span');
      dash.className = `dash-dot flex-1 max-w-[28px] min-w-[8px] h-[2px] rounded-full transition-all duration-300 cursor-pointer ${idx === 0 ? 'bg-white' : 'bg-white/30'}`;
      dash.addEventListener('click', () => updateSlider(idx));
      dashesContainer.appendChild(dash);
    });

    function updateSlider(index) {
      if (index < 0) {
        currentIndex = sliderData.length - 1;
      } else if (index >= sliderData.length) {
        currentIndex = 0;
      } else {
        currentIndex = index;
      }

      // Smooth crossfade
      imgEl.style.opacity = '0.3';
      titleEl.style.opacity = '0.3';
      descEl.style.opacity = '0.3';

      setTimeout(() => {
        imgEl.src = sliderData[currentIndex].src;
        imgEl.alt = sliderData[currentIndex].title;
        titleEl.innerText = sliderData[currentIndex].title;
        descEl.innerText = sliderData[currentIndex].desc;

        imgEl.style.opacity = '1';
        titleEl.style.opacity = '1';
        descEl.style.opacity = '1';

        // Update dashes
        const dots = dashesContainer.querySelectorAll('.dash-dot');
        dots.forEach((dot, idx) => {
          if (idx === currentIndex) {
            dot.classList.remove('bg-white/30');
            dot.classList.add('bg-white');
          } else {
            dot.classList.remove('bg-white');
            dot.classList.add('bg-white/30');
          }
        });
      }, 150);
    }

    if (prevBtn) {
      prevBtn.addEventListener('click', () => updateSlider(currentIndex - 1));
    }
    if (nextBtn) {
      nextBtn.addEventListener('click', () => updateSlider(currentIndex + 1));
    }

    // Keyboard navigation
    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowLeft') updateSlider(currentIndex - 1);
      if (e.key === 'ArrowRight') updateSlider(currentIndex + 1);
    });

    // Touch swipe support
    let touchStartX = 0;
    let touchEndX = 0;
    const container = document.querySelector('main');

    if (container) {
      container.addEventListener('touchstart', (e) => {
        touchStartX = e.changedTouches[0].screenX;
      }, { passive: true });

      container.addEventListener('touchend', (e) => {
        touchEndX = e.changedTouches[0].screenX;
        const diff = touchEndX - touchStartX;
        if (Math.abs(diff) > 40) {
          if (diff < 0) {
            updateSlider(currentIndex + 1);
          } else {
            updateSlider(currentIndex - 1);
          }
        }
      }, { passive: true });
    }
  </script>

</body>
</html>
