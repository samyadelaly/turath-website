<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0A0A0A">
  <title>Decorative Objects Collection | Turath Egypt</title>
  <meta name="description" content="Explore our handcrafted solid brass and copper decorative objects, artisan vessels, and luxury home decor made in Cairo, Egypt.">
  <meta name="keywords" content="أطباق نحاس، صواني معلقة، تحف نحاسية، حفر على النحاس، فنون إسلامية، خان الخليلي، تراث، Turath, Wall Charger, Brass Plate, Arabesque Relief, Islamic Antiques, Egyptian Artisans, ورشة نحاس بالجمالية, تشكيل نحاس عمولة, ديكورات نحاسية, تصنيع نجف عمولة, Custom brass fabrication, Handcrafted copper decor, Bespoke metalwork, تصنيع نحاس يدوي">

  <!-- Open Graph / Facebook / WhatsApp -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://turath-egypt.com/decor.html">
  <meta property="og:title" content="Decorative Objects Collection | Turath Egypt">
  <meta property="og:description" content="Handcrafted solid brass decorative vessels, artisanal centerpieces, and luxury wall medallions. Egyptian metal manufacturing.">
  <meta property="og:image" content="/assets/images/decor/royal-arabesque-brass-wall-charger.jpg">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Inter:wght@400;500;600;700;800;900&family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=Space+Mono:wght@700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com" defer></script>

  <link rel="stylesheet" href="./src/style.css">
</head>
<body class="bg-[#050505] text-white antialiased overflow-hidden selection:bg-[#D7C797] selection:text-black">
    <!-- Premium Knockout Preloader -->
  <div id="luxury-preloader" class="fixed inset-0 w-screen h-screen z-[99999] pointer-events-none transition-opacity duration-1000 ease-in-out">
    <svg width="100%" height="100%" class="w-full h-full">
      <defs>
        <mask id="knockout-text">
          <!-- White background means solid, black text means transparent hole -->
          <rect width="100%" height="100%" fill="white" />
          <text x="50%" y="50%" text-anchor="middle" dominant-baseline="middle" font-size="clamp(4rem, 15vw, 12rem)" font-weight="300" fill="black" letter-spacing="0.1em" font-family="sans-serif" class="knockout-animate">TURATH</text>
        </mask>
      </defs>
      <rect width="100%" height="100%" fill="#0a0a0a" mask="url(#knockout-text)" />
    </svg>
  </div>

  <main class="min-h-screen bg-[#050505] text-white overflow-hidden">
    <div class="relative w-full h-[100dvh] md:h-[90vh] md:aspect-[9/16] md:mx-auto bg-black lg:h-[85vh] lg:max-w-6xl lg:aspect-auto lg:rounded-2xl lg:shadow-2xl lg:my-6 lg:overflow-hidden">
      
      <!-- Top Navbar -->
      <div class="w-full grid grid-cols-3 items-center px-4 py-4 md:px-10 md:py-6 z-50 absolute top-0 left-0 bg-gradient-to-b from-black/80 via-black/40 to-transparent">
        <a href="index.html#gallery" class="justify-self-start text-white text-3xl font-light hover:opacity-70 transition-opacity cursor-pointer leading-none" aria-label="Back to Collections">&larr;</a>
        <span class="justify-self-center text-center whitespace-nowrap text-xs md:text-sm font-light tracking-[0.2em] sm:tracking-[0.3em] uppercase text-white/70">DECORATIVE OBJECTS</span>
        <button id="share-btn" type="button" class="justify-self-end w-6 h-6 text-white/70 hover:text-white transition-colors cursor-pointer pointer-events-auto flex items-center justify-center" aria-label="Share" title="Share">
          <svg class="w-5 h-5 mx-auto" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M7.217 10.907a2.25 2.25 0 100 2.186m0-2.186c.18.324.283.696.283 1.093s-.103.77-.283 1.093m0-2.186l9.566-5.314m-9.566 7.5l9.566 5.314m0 0a2.25 2.25 0 103.935 2.186 2.25 2.25 0 00-3.935-2.186zm0-12.814a2.25 2.25 0 103.933-2.185 2.25 2.25 0 00-3.933 2.185z" /></svg>
        </button>
      </div>

      <!-- Centered Product Title -->
      <div class="absolute top-[15%] md:top-[20%] left-0 w-full flex justify-center items-center z-40 px-4 pointer-events-none">
        <h1 id="slider-title" class="text-lg md:text-xl lg:text-3xl xl:text-4xl font-bold tracking-[0.2em] text-white uppercase text-center drop-shadow-md">
          ROYAL ARABESQUE BRASS WALL CHARGER
        </h1>
      </div>

      <!-- Center Navigation Arrows -->
      <div class="absolute top-1/2 left-0 w-full -translate-y-1/2 flex justify-between items-center px-4 md:px-6 z-40 pointer-events-none">
        <button id="prev-btn" class="text-white/60 hover:text-white text-3xl md:text-4xl font-light transition-colors pointer-events-auto cursor-pointer" aria-label="Previous Image">&larr;</button>
        <button id="next-btn" class="text-white/60 hover:text-white text-3xl md:text-4xl font-light transition-colors pointer-events-auto cursor-pointer" aria-label="Next Image">&rarr;</button>
      </div>

      <!-- Main Product Image -->
      <img id="slider-image" src="/assets/images/decor/royal-arabesque-brass-wall-charger.jpg" alt="ROYAL ARABESQUE BRASS WALL CHARGER" class="w-full h-full object-cover transition-opacity duration-300" loading="eager" fetchpriority="high">
      
      <!-- Bottom Overlay: AI Description & Dashes -->
      <div class="absolute bottom-0 left-0 w-full p-6 pb-10 bg-gradient-to-t from-black/95 via-black/60 to-transparent z-50 flex flex-col items-center gap-6">
        <p id="slider-desc" class="text-white/90 text-sm md:text-base lg:text-lg font-light tracking-wide text-center max-w-md lg:max-w-2xl drop-shadow-md leading-relaxed min-h-[3rem]">
          A monumental wall-mounted circular charger hand-etched in solid brass, featuring intricate classical Islamic floral arabesques and radiating star medallions.
        </p>
        <div id="dashes-container" class="flex justify-center items-center gap-2 sm:gap-2.5 w-full max-w-xs sm:max-w-sm px-4 overflow-hidden"></div>
      </div>
    </div>
  </main>

  <script>
    const sliderData = [
      {
        src: '/assets/images/decor/royal-arabesque-brass-wall-charger.jpg',
        title: 'ROYAL ARABESQUE BRASS WALL CHARGER',
        desc: 'A monumental wall-mounted circular charger hand-etched in solid brass, featuring intricate classical Islamic floral arabesques and radiating star medallions.'
      },
      {
        src: '/assets/images/decor/honeycomb-faceted-hammered-copper-shield.jpg',
        title: 'HONEYCOMB FACETED HAMMERED COPPER SHIELD',
        desc: 'A sculptural concave wall medallion hand-hammered in warm bronze-toned brass, radiating from a central floral rosette into hundreds of faceted honeycomb cells.'
      },
      {
        src: '/assets/images/decor/golden-divers-cast-brass-wall-sculptures.jpg',
        title: 'GOLDEN DIVERS SCULPTURAL WALL INSTALLATION',
        desc: 'A dynamic set of five cast brass diver figurines hand-sculpted in suspended motion, mounted across a textured stone feature wall above river stone bedding.'
      },
      {
        src: '/assets/images/decor/pleated-sunburst-polished-brass-disk.jpg',
        title: 'PLEATED SUNBURST POLISHED BRASS DISK',
        desc: 'A dramatic circular wall sculpture crafted in mirror-polished golden brass, featuring deep accordion pleats that catch the light in a hypnotic radiating sunburst.'
      },
      {
        src: '/assets/images/decor/openwork-filigree-brass-leaf-sculptures.jpg',
        title: 'OPENWORK FILIGREE BRASS BOTANICAL LEAVES',
        desc: 'A set of four sculptural brass leaves featuring openwork vein filigree and polished contours, casting intricate shadow patterns across contemporary feature walls.'
      },
      {
        src: '/assets/images/decor/decor-01.jpg',
        title: 'HAMMERED BRASS VESSEL',
        desc: 'A monumental handcrafted solid brass decorative basin shaped with thousands of precise hand-hammered facets.'
      },
      {
        src: '/assets/images/decor/decor-02.jpg',
        title: 'ORGANIC CAST BRONZE PLATTER',
        desc: 'A multi-compartment artisanal serving tray hand-cast in solid brass with an earthy textured bronze patina.'
      },
      {
        src: '/assets/images/decor/decor-03.jpg',
        title: 'SCULPTURAL BRASS DUO BOWLS',
        desc: 'A pair of freeform decorative brass bowls with soft undulating rim contours and hand-buffed warm luster.'
      },
      {
        src: '/assets/images/decor/decor-04.jpg',
        title: 'ARABESQUE BRASS WALL NICHE',
        desc: 'An architectural solid brass wall sculpture featuring flowing arabesque ribbon motifs and an integrated display ledge.'
      },
      {
        src: '/assets/images/decor/decor-05.jpg',
        title: 'FILIGREE BRASS MEDALLION SHELF',
        desc: 'An ornate hand-finished brass wall medallion featuring intricate lattice fretwork and classical symmetrical flourishes.'
      }
    ];

    // Read initial product from URL if present: ?product=...-item-2 or ?item=2
        const urlParams = new URLSearchParams(window.location.search);
        const productParam = urlParams.get('product') || urlParams.get('item');
        let initialIndex = 0;
        if (productParam) {
          const match = productParam.match(/-item-(\d+)$/i);
          const parsedIdx = match ? (parseInt(match[1], 10) - 1) : (parseInt(productParam, 10) - 1);
          if (!isNaN(parsedIdx) && parsedIdx >= 0 && parsedIdx < sliderData.length) {
            initialIndex = parsedIdx;
          }
        }
        let currentIndex = initialIndex;
    const titleEl = document.getElementById('slider-title');
    const descEl = document.getElementById('slider-desc');
    const imgEl = document.getElementById('slider-image');
    const dashesContainer = document.getElementById('dashes-container');
    const prevBtn = document.getElementById('prev-btn');
    const nextBtn = document.getElementById('next-btn');

    // Build Dash indicators dynamically
    sliderData.forEach((_, idx) => {
      const dash = document.createElement('span');
      dash.className = `dash-dot flex-1 max-w-[28px] min-w-[8px] h-[2px] rounded-full transition-all duration-300 cursor-pointer ${idx === currentIndex ? 'bg-white' : 'bg-white/30'}`;
      dash.addEventListener('click', () => updateSlider(idx));
      dashesContainer.appendChild(dash);
        });
    
        if (currentIndex !== 0 && sliderData[currentIndex]) {
          imgEl.src = sliderData[currentIndex].src;
          imgEl.alt = sliderData[currentIndex].title;
          titleEl.innerText = sliderData[currentIndex].title;
          descEl.innerText = sliderData[currentIndex].desc;
        }

    function updateSlider(index) {
      if (index < 0) {
        currentIndex = sliderData.length - 1;
      } else if (index >= sliderData.length) {
        currentIndex = 0;
      } else {
        currentIndex = index;
      }

      // Smooth crossfade
      imgEl.style.opacity = '0.3';
      titleEl.style.opacity = '0.3';
      descEl.style.opacity = '0.3';

      setTimeout(() => {
        imgEl.src = sliderData[currentIndex].src;
        imgEl.alt = sliderData[currentIndex].title;
        titleEl.innerText = sliderData[currentIndex].title;
        descEl.innerText = sliderData[currentIndex].desc;

        imgEl.style.opacity = '1';
        titleEl.style.opacity = '1';
        descEl.style.opacity = '1';

        // Update dashes
        const dots = dashesContainer.querySelectorAll('.dash-dot');
        dots.forEach((dot, idx) => {
          if (idx === currentIndex) {
            dot.classList.remove('bg-white/30');
            dot.classList.add('bg-white');
          } else {
            dot.classList.remove('bg-white');
            dot.classList.add('bg-white/30');
          }
        });
      }, 150);
    }

    if (prevBtn) {
      prevBtn.addEventListener('click', () => updateSlider(currentIndex - 1));
    }
    if (nextBtn) {
      nextBtn.addEventListener('click', () => updateSlider(currentIndex + 1));
    }

    // Keyboard navigation
    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowLeft') updateSlider(currentIndex - 1);
      if (e.key === 'ArrowRight') updateSlider(currentIndex + 1);
    });

    // Touch swipe support
    let touchStartX = 0;
    let touchEndX = 0;
    const container = document.querySelector('main');

    if (container) {
      container.addEventListener('touchstart', (e) => {
        touchStartX = e.changedTouches[0].screenX;
      }, { passive: true });

      container.addEventListener('touchend', (e) => {
        touchEndX = e.changedTouches[0].screenX;
        const diff = touchEndX - touchStartX;
        if (Math.abs(diff) > 40) {
          if (diff < 0) {
            updateSlider(currentIndex + 1);
          } else {
            updateSlider(currentIndex - 1);
          }
        }
      }, { passive: true });
    }
  
    // Share button interaction (dynamic SSG product link)
    const shareBtn = document.getElementById('share-btn');
    if (shareBtn) {
      shareBtn.addEventListener('click', async (e) => {
        e.preventDefault();
        const title = (typeof titleEl !== 'undefined' && titleEl) ? titleEl.innerText : document.title;
        
        // Extract category slug from URL
        const path = window.location.pathname;
        const match = path.match(/\/([a-z0-9-]+)(?:\.html)?$/i);
        const categorySlug = match ? match[1] : 'lighting';
        
        // Determine active product ID based on current slide
        const currentItem = (typeof sliderData !== 'undefined' && sliderData[currentIndex]) ? sliderData[currentIndex] : null;
        const activeProductId = (currentItem && currentItem.id) ? currentItem.id : `${categorySlug}-item-${(typeof currentIndex !== 'undefined' ? currentIndex : 0) + 1}`;
        
        // Construct specific SSG share URL
        const shareUrl = window.location.origin + '/products/' + activeProductId + '/';

        if (navigator.share) {
          try {
            await navigator.share({ title: title, url: shareUrl });
          } catch (err) {}
        } else if (navigator.clipboard) {
          await navigator.clipboard.writeText(shareUrl);
          shareBtn.classList.add('text-[#D7C797]');
          setTimeout(() => shareBtn.classList.remove('text-[#D7C797]'), 1500);
        }
      });
    }

  
    // Luxury CNC Preloader Fadeout
    window.addEventListener('load', () => {
      const preloader = document.getElementById('luxury-preloader');
      if (preloader) {
        setTimeout(() => {
          preloader.style.opacity = '0';
          setTimeout(() => preloader.remove(), 700);
        }, 1500);
      }
    });
</script>

</body>
</html>
