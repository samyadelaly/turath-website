<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0A0A0A">
  <title>Lighting Collection — TURATH</title>
  <meta name="description" content="Explore our handcrafted architectural brass lighting collection made in Cairo, Egypt.">

  <!-- Open Graph / Facebook / WhatsApp -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://turath-egypt.com/lighting.html">
  <meta property="og:title" content="Lighting Collection — TURATH">
  <meta property="og:description" content="Handcrafted solid brass lighting fixtures with timeless finishes. Egyptian artisan metal manufacturing.">
  <meta property="og:image" content="/assets/images/lighting/lighting-hero.jpg">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Inter:wght@400;500;600;700;800;900&family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=Space+Mono:wght@700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <link rel="stylesheet" href="./src/style.css">
</head>
<body class="bg-[#050505] text-white antialiased overflow-hidden selection:bg-[#D7C797] selection:text-black">

  <main class="min-h-screen bg-[#050505] text-white overflow-hidden">
    <div class="relative w-full h-[100dvh] md:h-[90vh] md:aspect-[9/16] md:mx-auto bg-black">
      
      <!-- Top Navbar -->
      <div class="absolute top-0 left-0 w-full p-6 md:p-10 flex items-center justify-between z-50 bg-gradient-to-b from-black/80 via-black/40 to-transparent">
        <a href="/#collections" class="text-white text-3xl font-light hover:opacity-70 transition-opacity cursor-pointer leading-none" aria-label="Back to Collections">&larr;</a>
        <span class="text-xs md:text-sm font-light tracking-[0.3em] uppercase text-white/70">LIGHTING</span>
      </div>

      <!-- Centered Product Title -->
      <div class="absolute top-[15%] md:top-[20%] left-0 w-full flex justify-center items-center z-40 px-4 pointer-events-none">
        <h1 id="slider-title" class="text-lg md:text-xl lg:text-2xl font-bold tracking-[0.2em] text-white uppercase text-center drop-shadow-md">
          SOLID BRASS APPLIQUE
        </h1>
      </div>

      <!-- Center Navigation Arrows -->
      <div class="absolute top-1/2 left-0 w-full -translate-y-1/2 flex justify-between items-center px-4 md:px-6 z-40 pointer-events-none">
        <button id="prev-btn" class="text-white/60 hover:text-white text-3xl md:text-4xl font-light transition-colors pointer-events-auto cursor-pointer" aria-label="Previous Image">&larr;</button>
        <button id="next-btn" class="text-white/60 hover:text-white text-3xl md:text-4xl font-light transition-colors pointer-events-auto cursor-pointer" aria-label="Next Image">&rarr;</button>
      </div>

      <!-- Main Product Image -->
      <img id="slider-image" src="/assets/images/lighting/lighting-hero.jpg" alt="Lighting Product" class="w-full h-full object-cover transition-opacity duration-300">
      
      <!-- Bottom Overlay: AI Description & Dashes -->
      <div class="absolute bottom-0 left-0 w-full p-6 pb-10 bg-gradient-to-t from-black/95 via-black/60 to-transparent z-50 flex flex-col items-center gap-6">
        <p id="slider-desc" class="text-white/90 text-sm md:text-base font-light tracking-wide text-center max-w-md drop-shadow-md leading-relaxed min-h-[3rem]">
          A handcrafted solid brass wall sconce featuring a textured finish that casts a warm, architectural glow.
        </p>
        <div id="dashes-container" class="flex justify-center items-center gap-3">
          <span class="dash-dot w-8 h-[2px] bg-white rounded-full transition-all duration-300 cursor-pointer"></span>
          <span class="dash-dot w-8 h-[2px] bg-white/30 rounded-full transition-all duration-300 cursor-pointer"></span>
          <span class="dash-dot w-8 h-[2px] bg-white/30 rounded-full transition-all duration-300 cursor-pointer"></span>
          <span class="dash-dot w-8 h-[2px] bg-white/30 rounded-full transition-all duration-300 cursor-pointer"></span>
          <span class="dash-dot w-8 h-[2px] bg-white/30 rounded-full transition-all duration-300 cursor-pointer"></span>
          <span class="dash-dot w-8 h-[2px] bg-white/30 rounded-full transition-all duration-300 cursor-pointer"></span>
        </div>
      </div>
    </div>
  </main>

  <script>
    const sliderData = [
      {
        src: '/assets/images/lighting/lighting-hero.jpg',
        title: 'SOLID BRASS APPLIQUE',
        desc: 'A handcrafted solid brass wall sconce featuring a textured finish that casts a warm, architectural glow.'
      },
      {
        src: '/assets/images/lighting/lighting-geometric-chandelier.jpg',
        title: 'GEOMETRIC BRASS CHANDELIER',
        desc: 'A sculptural multi-arm chandelier handcrafted in solid brass with warm multidirectional ambient lighting.'
      },
      {
        src: '/assets/images/lighting/lighting-kinetic-pendant.jpg',
        title: 'KINETIC BRASS PENDANT',
        desc: 'A minimalist architectural chandelier featuring slender balanced brass arms and radiating globe illumination.'
      },
      {
        src: '/assets/images/lighting/lighting-arabesque-lantern.jpg',
        title: 'ENGRAVED ARABESQUE LANTERN',
        desc: 'A cylindrical pierced brass pendant meticulously hand-carved with traditional Islamic arabesque motifs.'
      },
      {
        src: '/assets/images/lighting/lighting-fluted-sconce.jpg',
        title: 'FLUTED BRASS PIPE SCONCE',
        desc: 'A dramatic statement wall sconce crafted from staggered tubular brass pipes casting a sunburst halo of light.'
      },
      {
        src: '/assets/images/lighting/lighting-crown-chandelier.jpg',
        title: 'CROWN RING CHANDELIER',
        desc: 'A majestic circular solid brass chandelier featuring tapered white shades for refined, glare-free dining illumination.'
      }
    ];

    let currentIndex = 0;
    const titleEl = document.getElementById('slider-title');
    const descEl = document.getElementById('slider-desc');
    const imgEl = document.getElementById('slider-image');
    const dashesContainer = document.getElementById('dashes-container');
    const prevBtn = document.getElementById('prev-btn');
    const nextBtn = document.getElementById('next-btn');

    function updateSlider(index) {
      if (index < 0) {
        currentIndex = sliderData.length - 1;
      } else if (index >= sliderData.length) {
        currentIndex = 0;
      } else {
        currentIndex = index;
      }

      // Smooth crossfade
      imgEl.style.opacity = '0.3';
      titleEl.style.opacity = '0.3';
      descEl.style.opacity = '0.3';

      setTimeout(() => {
        imgEl.src = sliderData[currentIndex].src;
        titleEl.innerText = sliderData[currentIndex].title;
        descEl.innerText = sliderData[currentIndex].desc;

        imgEl.style.opacity = '1';
        titleEl.style.opacity = '1';
        descEl.style.opacity = '1';

        // Update dashes
        const dots = dashesContainer.querySelectorAll('.dash-dot');
        dots.forEach((dot, idx) => {
          if (idx === currentIndex) {
            dot.className = 'dash-dot w-8 h-[2px] bg-white rounded-full transition-all duration-300 cursor-pointer';
          } else {
            dot.className = 'dash-dot w-8 h-[2px] bg-white/30 rounded-full transition-all duration-300 cursor-pointer';
          }
        });
      }, 150);
    }

    if (prevBtn) {
      prevBtn.addEventListener('click', () => updateSlider(currentIndex - 1));
    }
    if (nextBtn) {
      nextBtn.addEventListener('click', () => updateSlider(currentIndex + 1));
    }

    // Direct dash clicks
    if (dashesContainer) {
      const dots = dashesContainer.querySelectorAll('.dash-dot');
      dots.forEach((dot, idx) => {
        dot.addEventListener('click', () => updateSlider(idx));
      });
    }

    // Keyboard navigation
    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowLeft') updateSlider(currentIndex - 1);
      if (e.key === 'ArrowRight') updateSlider(currentIndex + 1);
    });

    // Touch swipe support
    let touchStartX = 0;
    let touchEndX = 0;
    const container = document.querySelector('main');

    if (container) {
      container.addEventListener('touchstart', (e) => {
        touchStartX = e.changedTouches[0].screenX;
      }, { passive: true });

      container.addEventListener('touchend', (e) => {
        touchEndX = e.changedTouches[0].screenX;
        const diff = touchEndX - touchStartX;
        if (Math.abs(diff) > 40) {
          if (diff < 0) {
            updateSlider(currentIndex + 1);
          } else {
            updateSlider(currentIndex - 1);
          }
        }
      }, { passive: true });
    }
  </script>

</body>
</html>
