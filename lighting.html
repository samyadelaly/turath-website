<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0A0A0A">
  <title>LIGHTING — TURATH</title>
  <meta name="description" content="Handcrafted brass lighting fixture with a timeless finish. Egyptian artisan metal manufacturing.">

  <!-- Open Graph / Facebook / WhatsApp -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://turath-egypt.com/lighting.html">
  <meta property="og:title" content="TURATH — Lighting">
  <meta property="og:description" content="Handcrafted brass lighting fixture with a timeless finish. Egyptian artisan metal manufacturing.">
  <meta property="og:image" content="/assets/images/lighting/lighting-hero.jpg">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Inter:wght@400;500;600;700;800;900&family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=Space+Mono:wght@700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <link rel="stylesheet" href="./src/style.css">
</head>
<body class="bg-[#050505] text-white antialiased overflow-hidden selection:bg-[#D7C797] selection:text-black">

  <main class="min-h-screen bg-[#050505] text-white overflow-hidden">
    <!-- Full-screen Image Section (Mobile: 100dvh, Desktop: 9:16 ratio) -->
    <div class="relative w-full h-[100dvh] md:w-auto md:h-[90vh] md:max-w-[calc(90vh*9/16)] md:aspect-[9/16] md:mx-auto md:my-[5vh] bg-black shadow-2xl overflow-hidden">
      
      <!-- Top Overlay: Arrow & Category Title -->
      <div class="absolute top-0 left-0 w-full p-6 md:p-10 flex items-center gap-6 z-50 bg-gradient-to-b from-black/80 to-transparent">
        <a href="/#collections" class="text-white text-3xl font-light hover:opacity-70 transition-opacity leading-none" aria-label="Back to Collections">&larr;</a>
        <h1 class="text-xl md:text-2xl font-light tracking-[0.2em] uppercase">LIGHTING</h1>
      </div>

      <!-- Main Product Image (Use the attached product image) -->
      <img src="/assets/images/lighting/lighting-hero.jpg" alt="Lighting Product" class="w-full h-full object-cover">
      
      <!-- Bottom Overlay: 1-Line Description & Dashes -->
      <div class="absolute bottom-0 left-0 w-full p-6 pb-10 bg-gradient-to-t from-black/90 via-black/40 to-transparent z-50 flex flex-col items-center gap-6">
        <!-- 1-Line Description -->
        <p class="text-white/90 text-sm md:text-base font-light tracking-wide text-center drop-shadow-md max-w-md">
          Handcrafted brass lighting fixture with a timeless finish.
        </p>
        <!-- Dashes -->
        <div class="flex justify-center items-center gap-3">
          <span class="w-8 h-[2px] bg-white"></span>
          <span class="w-8 h-[2px] bg-white/30"></span>
          <span class="w-8 h-[2px] bg-white/30"></span>
        </div>
      </div>
    </div>
  </main>

</body>
</html>
