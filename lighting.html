<body class="bg-[#050505] text-white antialiased overflow-hidden selection:bg-[#D7C797] selection:text-black">
    <!-- Premium Knockout Preloader -->
  <div id="luxury-preloader" class="fixed inset-0 w-screen h-screen z-[99999] pointer-events-none transition-opacity duration-1000 ease-in-out">
    <svg width="100%" height="100%" class="w-full h-full">
      <defs>
        <mask id="knockout-text">
          <!-- White background means solid, black text means transparent hole -->
          <rect width="100%" height="100%" fill="white" />
          <text x="50%" y="50%" text-anchor="middle" dominant-baseline="middle" font-size="clamp(4rem, 15vw, 12rem)" font-weight="300" fill="black" letter-spacing="0.1em" font-family="sans-serif" class="knockout-animate">TURATH</text>
        </mask>
      </defs>
      <rect width="100%" height="100%" fill="#0a0a0a" mask="url(#knockout-text)" />
    </svg>
  </div>

  <main class="min-h-screen bg-[#050505] text-white overflow-hidden">
    <div class="relative w-full h-[100dvh] md:h-[90vh] md:aspect-[9/16] md:mx-auto bg-black">
      
      <!-- Top Navbar -->
      <div class="w-full grid grid-cols-3 items-center px-4 py-4 md:px-10 md:py-6 z-50 absolute top-0 left-0 bg-gradient-to-b from-black/80 via-black/40 to-transparent">
        <a href="index.html#gallery" class="justify-self-start text-white text-3xl font-light hover:opacity-70 transition-opacity cursor-pointer leading-none" aria-label="Back to Collections">&larr;</a>
        <span class="justify-self-center text-center whitespace-nowrap text-xs md:text-sm font-light tracking-[0.2em] sm:tracking-[0.3em] uppercase text-white/70">LIGHTING</span>
        <button id="share-btn" type="button" class="justify-self-end w-6 h-6 text-white/70 hover:text-white transition-colors cursor-pointer pointer-events-auto flex items-center justify-center" aria-label="Share" title="Share">
          <svg class="w-5 h-5 mx-auto" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M7.217 10.907a2.25 2.25 0 100 2.186m0-2.186c.18.324.283.696.283 1.093s-.103.77-.283 1.093m0-2.186l9.566-5.314m-9.566 7.5l9.566 5.314m0 0a2.25 2.25 0 103.935 2.186 2.25 2.25 0 00-3.935-2.186zm0-12.814a2.25 2.25 0 103.933-2.185 2.25 2.25 0 00-3.933 2.185z" /></svg>
        </button>
      </div>

      <!-- Centered Product Title -->
      <div class="absolute top-[15%] md:top-[20%] left-0 w-full flex justify-center items-center z-40 px-4 pointer-events-none">
        <h1 id="slider-title" class="text-lg md:text-xl lg:text-2xl font-bold tracking-[0.2em] text-white uppercase text-center drop-shadow-md">
          SCULPTURAL HAMMERED BRASS SCROLL SCONCE
        </h1>
      </div>

      <!-- Center Navigation Arrows -->
      <div class="absolute top-1/2 left-0 w-full -translate-y-1/2 flex justify-between items-center px-4 md:px-6 z-40 pointer-events-none">
        <button id="prev-btn" class="text-white/60 hover:text-white text-3xl md:text-4xl font-light transition-colors pointer-events-auto cursor-pointer" aria-label="Previous Image">&larr;</button>
        <button id="next-btn" class="text-white/60 hover:text-white text-3xl md:text-4xl font-light transition-colors pointer-events-auto cursor-pointer" aria-label="Next Image">&rarr;</button>
      </div>

      <!-- Main Product Image -->
      <img id="slider-image" src="/assets/images/lighting/hammered-brass-scroll-sconce.jpg" alt="SCULPTURAL HAMMERED BRASS SCROLL SCONCE" class="w-full h-full object-cover transition-opacity duration-300">
      
      <!-- Bottom Overlay: AI Description & Dashes -->
      <div class="absolute bottom-0 left-0 w-full p-6 pb-10 bg-gradient-to-t from-black/95 via-black/60 to-transparent z-50 flex flex-col items-center gap-6">
        <p id="slider-desc" class="text-white/90 text-sm md:text-base font-light tracking-wide text-center max-w-md drop-shadow-md leading-relaxed min-h-[3rem]">
          A statement architectural wall sconce formed from an overlapping curved scroll of solid brass, hand-hammered with a shimmering dimpled texture.
        </p>
        <div id="dashes-container" class="flex justify-center items-center gap-1 w-full max-w-xs sm:max-w-md px-2 overflow-hidden"></div>
      </div>
    </div>
  </main>

  <script>
    const sliderData = [
      {

      },
      {

      {

      {

      },
      {

      },
      {

      },
      {

      },
      {

      },

      },

      },
      {

      },
      {

            "title": "CELESTIAL VERDIGRIS BRASS SCONCE",

      },
      {
            "src": "/assets/images/lighting/teardrop-filigree-brass-pendant.jpg",

      },
      {
            "src": "/assets/images/lighting/cascading-brass-disc-chandelier.jpg",
            "title": "CASCADING BRASS DISC CHANDELIER",
            "desc": "A multi-tier statement chandelier featuring sunburst textured brass discs and ribbed blown glass lanterns suspended at sculpted heights."
      },
      {
            "src": "/assets/images/lighting/pierced-ovoid-brass-lantern.jpg",

      },
      {
            "src": "/assets/images/lighting/arabesque-spherical-brass-pendant.jpg",

      },
      {
            "src": "/assets/images/lighting/patinated-brass-disc-triptych.jpg",
            "title": "PATINATED BRASS DISC TRIPTYCH",
            "desc": "A vertical triptych of three hand-hammered patinated brass disc sconces, each casting a soft golden halo of indirect architectural light."
      },
      {
            "src": "/assets/images/lighting/cylindrical-filigree-brass-pendant.jpg",
            "title": "CYLINDRICAL FILIGREE PENDANT",

      },
      {
            "src": "/assets/images/lighting/trio-filigree-cluster-chandelier.jpg",

      },
      {
            "src": "/assets/images/lighting/geometric-brass-plate-sconce.jpg",
            "title": "GEOMETRIC BRASS PLATE SCONCE",
            "desc": "An architectural wall sconce sculpted from layered rectilinear brushed solid brass plates, casting multi-directional warm halo illumination."
      },
      {
            "src": "/assets/images/lighting/slender-brass-torch-sconce.jpg",
            "title": "SLENDER BRASS TORCH SCONCE",
            "desc": "A neoclassical solid brass torch fixture featuring an elongated drop spindle finial and a tailored linen lampshade diffusing soft, glare-free light."
      },
      {
            "src": "/assets/images/lighting/cantilever-brass-orb-lamp.jpg",
            "title": "CANTILEVER BRASS ORB LAMP",
            "desc": "A sculptural minimalist balance lamp featuring a precision-calibrated solid brass arm and a hand-blown frosted glass illuminating sphere."
      },
      {
            "src": "/assets/images/lighting/hammered-brass-teardrop-pendant.jpg",
            "title": "HAMMERED BRASS TEARDROP PENDANT",
            "desc": "A teardrop-shaped solid brass pendant hand-hammered by master Egyptian artisans, radiating an intimate, downward golden pool of light."
      },
      {
            "src": "/assets/images/lighting/dual-capsule-arched-brass-sconce.jpg",
            "title": "DUAL CAPSULE ARCHED BRASS SCONCE",
            "desc": "A dramatic double-light architectural sconce featuring curved solid brass arched arms and twin frosted glass capsules mounted on a slotted escutcheon."
      },
      {
            "src": "/assets/images/lighting/lighting-hero.jpg",
            "title": "SOLID BRASS APPLIQUE",
            "desc": "A handcrafted solid brass wall sconce featuring a textured finish that casts a warm, architectural glow."
      },
      {
            "src": "/assets/images/lighting/lighting-geometric-chandelier.jpg",
            "title": "GEOMETRIC BRASS CHANDELIER",
            "desc": "A sculptural multi-arm chandelier handcrafted in solid brass with warm multidirectional ambient lighting."
      },
      {
            "src": "/assets/images/lighting/lighting-kinetic-pendant.jpg",
            "title": "KINETIC BRASS PENDANT",
            "desc": "A minimalist architectural chandelier featuring slender balanced brass arms and radiating globe illumination."
      },
      {
            "src": "/assets/images/lighting/lighting-arabesque-lantern.jpg",
            "title": "ENGRAVED ARABESQUE LANTERN",
            "desc": "A cylindrical pierced brass pendant meticulously hand-carved with traditional Islamic arabesque motifs."
      },
      {
            "src": "/assets/images/lighting/lighting-fluted-sconce.jpg",
            "title": "FLUTED BRASS PIPE SCONCE",
            "desc": "A dramatic statement wall sconce crafted from staggered tubular brass pipes casting a sunburst halo of light."
      },
      {
            "src": "/assets/images/lighting/lighting-crown-chandelier.jpg",
            "title": "CROWN RING CHANDELIER",
            "desc": "A majestic circular solid brass chandelier featuring tapered white shades for refined, glare-free dining illumination."
      }
];

    // Read initial product from URL if present: ?product=...-item-2 or ?item=2
        const urlParams = new URLSearchParams(window.location.search);
        const productParam = urlParams.get('product') || urlParams.get('item');
        let initialIndex = 0;
        if (productParam) {
          const match = productParam.match(/-item-(\d+)$/i);
          const parsedIdx = match ? (parseInt(match[1], 10) - 1) : (parseInt(productParam, 10) - 1);
          if (!isNaN(parsedIdx) && parsedIdx >= 0 && parsedIdx < sliderData.length) {
            initialIndex = parsedIdx;
          }
        }
        let currentIndex = initialIndex;
    const titleEl = document.getElementById('slider-title');
    const descEl = document.getElementById('slider-desc');
    const imgEl = document.getElementById('slider-image');
    const dashesContainer = document.getElementById('dashes-container');
    const prevBtn = document.getElementById('prev-btn');
    const nextBtn = document.getElementById('next-btn');

    // Build Dash indicators dynamically
    sliderData.forEach((_, idx) => {
      const dash = document.createElement('span');
      dash.className = `dash-dot flex-1 max-w-[10px] min-w-[2px] h-[2px] rounded-full transition-all duration-300 cursor-pointer ${idx === currentIndex ? 'bg-white' : 'bg-white/30'}`;
      dash.addEventListener('click', () => updateSlider(idx));
      dashesContainer.appendChild(dash);
        });
    
        if (currentIndex !== 0 && sliderData[currentIndex]) {
          imgEl.src = sliderData[currentIndex].src;
          imgEl.alt = sliderData[currentIndex].title;
          titleEl.innerText = sliderData[currentIndex].title;
          descEl.innerText = sliderData[currentIndex].desc;
        }

    function updateSlider(index) {
      if (index < 0) {
        currentIndex = sliderData.length - 1;
      } else if (index >= sliderData.length) {
        currentIndex = 0;
      } else {
        currentIndex = index;
      }

      // Smooth crossfade
      imgEl.style.opacity = '0.3';
      titleEl.style.opacity = '0.3';
      descEl.style.opacity = '0.3';

      setTimeout(() => {
        imgEl.src = sliderData[currentIndex].src;
        imgEl.alt = sliderData[currentIndex].title;
        titleEl.innerText = sliderData[currentIndex].title;
        descEl.innerText = sliderData[currentIndex].desc;

        imgEl.style.opacity = '1';
        titleEl.style.opacity = '1';
        descEl.style.opacity = '1';

        // Update dashes
        const dots = dashesContainer.querySelectorAll('.dash-dot');
        dots.forEach((dot, idx) => {
          if (idx === currentIndex) {
            dot.classList.remove('bg-white/30');
            dot.classList.add('bg-white');
          } else {
            dot.classList.remove('bg-white');
            dot.classList.add('bg-white/30');
          }
        });
      }, 150);
    }

    if (prevBtn) {
      prevBtn.addEventListener('click', () => updateSlider(currentIndex - 1));
    }
    if (nextBtn) {
      nextBtn.addEventListener('click', () => updateSlider(currentIndex + 1));
    }

    // Keyboard navigation
    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowLeft') updateSlider(currentIndex - 1);
      if (e.key === 'ArrowRight') updateSlider(currentIndex + 1);
    });

    // Touch swipe support
    let touchStartX = 0;
    let touchEndX = 0;
    const container = document.querySelector('main');

    if (container) {
      container.addEventListener('touchstart', (e) => {
        touchStartX = e.changedTouches[0].screenX;
      }, { passive: true });

      container.addEventListener('touchend', (e) => {
        touchEndX = e.changedTouches[0].screenX;
        const diff = touchEndX - touchStartX;
        if (Math.abs(diff) > 40) {
          if (diff < 0) {
            updateSlider(currentIndex + 1);
          } else {
            updateSlider(currentIndex - 1);
          }
        }
      }, { passive: true });
    }
  
    // Share button interaction (dynamic SSG product link)
    const shareBtn = document.getElementById('share-btn');
    if (shareBtn) {
      shareBtn.addEventListener('click', async (e) => {
        e.preventDefault();
        const title = (typeof titleEl !== 'undefined' && titleEl) ? titleEl.innerText : document.title;
        
        // Extract category slug from URL
        const path = window.location.pathname;
        const match = path.match(/\/([a-z0-9-]+)(?:\.html)?$/i);
        const categorySlug = match ? match[1] : 'lighting';
        
        // Determine active product ID based on current slide
        const currentItem = (typeof sliderData !== 'undefined' && sliderData[currentIndex]) ? sliderData[currentIndex] : null;
        const activeProductId = (currentItem && currentItem.id) ? currentItem.id : `${categorySlug}-item-${(typeof currentIndex !== 'undefined' ? currentIndex : 0) + 1}`;
        
        // Construct specific SSG share URL
        const shareUrl = window.location.origin + '/products/' + activeProductId + '/';

        if (navigator.share) {
          try {
            await navigator.share({ title: title, url: shareUrl });
          } catch (err) {}
        } else if (navigator.clipboard) {
          await navigator.clipboard.writeText(shareUrl);
          shareBtn.classList.add('text-[#D7C797]');
          setTimeout(() => shareBtn.classList.remove('text-[#D7C797]'), 1500);
        }
      });
    }

  
    // Luxury CNC Preloader Fadeout
    window.addEventListener('load', () => {
      const preloader = document.getElementById('luxury-preloader');
      if (preloader) {
        setTimeout(() => {
          preloader.style.opacity = '0';
          setTimeout(() => preloader.remove(), 700);
        }, 1500);
      }
    });
</script>

</body>
</html>
