<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0A0A0A">
  <title>Solid Brass Applique — TURATH Lighting</title>
  <meta name="description" content="A handcrafted solid brass wall sconce featuring a textured finish that casts a warm, architectural glow.">

  <!-- Open Graph / Facebook / WhatsApp -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://turath-egypt.com/lighting.html">
  <meta property="og:title" content="Solid Brass Applique — TURATH Lighting">
  <meta property="og:description" content="A handcrafted solid brass wall sconce featuring a textured finish that casts a warm, architectural glow.">
  <meta property="og:image" content="/assets/images/lighting/lighting-hero.jpg">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Inter:wght@400;500;600;700;800;900&family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=Space+Mono:wght@700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <link rel="stylesheet" href="./src/style.css">
</head>
<body class="bg-[#050505] text-white antialiased overflow-hidden selection:bg-[#D7C797] selection:text-black">

  <main class="min-h-screen bg-[#050505] text-white overflow-hidden">
    <div class="relative w-full h-[100dvh] md:h-[90vh] md:aspect-[9/16] md:mx-auto bg-black">
      
      <!-- Top Navbar -->
      <div class="absolute top-0 left-0 w-full p-6 md:p-10 flex items-center justify-between z-50 bg-gradient-to-b from-black/80 to-transparent">
        <a href="/#collections" class="text-white text-3xl font-light hover:opacity-70 transition-opacity cursor-pointer">&larr;</a>
        <span class="text-xs md:text-sm font-light tracking-[0.3em] uppercase text-white/70">LIGHTING</span>
      </div>

      <!-- Specific Product Title (Centered Upper Middle) -->
      <div class="absolute top-[20%] left-0 w-full flex justify-center z-40 px-4 pointer-events-none">
        <h1 class="text-3xl md:text-4xl lg:text-5xl font-light tracking-[0.15em] text-white uppercase text-center drop-shadow-lg">
          Solid Brass Applique
        </h1>
      </div>

      <!-- Main Product Image -->
      <img src="/assets/images/lighting/lighting-hero.jpg" alt="Solid Brass Applique" class="w-full h-full object-cover">
      
      <!-- Bottom Overlay: AI Description & Dashes -->
      <div class="absolute bottom-0 left-0 w-full p-6 pb-10 bg-gradient-to-t from-black/95 via-black/60 to-transparent z-50 flex flex-col items-center gap-6">
        <!-- AI Description -->
        <p class="text-white/90 text-sm md:text-base font-light tracking-wide text-center max-w-md drop-shadow-md leading-relaxed">
          A handcrafted solid brass wall sconce featuring a textured finish that casts a warm, architectural glow.
        </p>
        <!-- Dashes -->
        <div class="flex justify-center items-center gap-3">
          <span class="w-8 h-[2px] bg-white rounded-full"></span>
          <span class="w-8 h-[2px] bg-white/30 rounded-full"></span>
          <span class="w-8 h-[2px] bg-white/30 rounded-full"></span>
        </div>
      </div>
    </div>
  </main>

</body>
</html>
