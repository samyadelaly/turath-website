<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0A0A0A">
  <title>Mirrors Collection — TURATH</title>
  <meta name="description" content="Explore our handcrafted architectural brass and copper mirrors made in Cairo, Egypt.">

  <!-- Open Graph / Facebook / WhatsApp -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://turath-egypt.com/mirrors.html">
  <meta property="og:title" content="Mirrors Collection — TURATH">
  <meta property="og:description" content="Handcrafted solid brass and copper mirrors with bespoke artisan frames. Egyptian metal manufacturing.">
  <meta property="og:image" content="/assets/images/mirrors/mirror-01.jpg">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Inter:wght@400;500;600;700;800;900&family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=Space+Mono:wght@700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <link rel="stylesheet" href="./src/style.css">
</head>
<body class="bg-[#050505] text-white antialiased overflow-hidden selection:bg-[#D7C797] selection:text-black">

  <main class="min-h-screen bg-[#050505] text-white overflow-hidden">
    <div class="relative w-full h-[100dvh] md:h-[90vh] md:aspect-[9/16] md:mx-auto bg-black">
      
      <!-- Top Navbar -->
      <div class="absolute top-0 left-0 w-full p-6 md:p-10 flex items-center justify-between z-50 bg-gradient-to-b from-black/80 via-black/40 to-transparent">
        <a href="index.html#scene-03" class="text-white text-3xl font-light hover:opacity-70 transition-opacity cursor-pointer leading-none" aria-label="Back to Collections">&larr;</a>
        <span class="text-xs md:text-sm font-light tracking-[0.3em] uppercase text-white/70">MIRRORS</span>
      </div>

      <!-- Centered Product Title -->
      <div class="absolute top-[15%] md:top-[20%] left-0 w-full flex justify-center items-center z-40 px-4 pointer-events-none">
        <h1 id="slider-title" class="text-lg md:text-xl lg:text-2xl font-bold tracking-[0.2em] text-white uppercase text-center drop-shadow-md">
          ISLAMIC STAR FILIGREE ROUND MIRROR
        </h1>
      </div>

      <!-- Center Navigation Arrows -->
      <div class="absolute top-1/2 left-0 w-full -translate-y-1/2 flex justify-between items-center px-4 md:px-6 z-40 pointer-events-none">
        <button id="prev-btn" class="text-white/60 hover:text-white text-3xl md:text-4xl font-light transition-colors pointer-events-auto cursor-pointer" aria-label="Previous Image">&larr;</button>
        <button id="next-btn" class="text-white/60 hover:text-white text-3xl md:text-4xl font-light transition-colors pointer-events-auto cursor-pointer" aria-label="Next Image">&rarr;</button>
      </div>

      <!-- Main Product Image -->
      <img id="slider-image" src="/assets/images/mirrors/islamic-star-filigree-round-mirror.jpg" alt="ISLAMIC STAR FILIGREE ROUND MIRROR" class="w-full h-full object-cover transition-opacity duration-300">
      
      <!-- Bottom Overlay: AI Description & Dashes -->
      <div class="absolute bottom-0 left-0 w-full p-6 pb-10 bg-gradient-to-t from-black/95 via-black/60 to-transparent z-50 flex flex-col items-center gap-6">
        <p id="slider-desc" class="text-white/90 text-sm md:text-base font-light tracking-wide text-center max-w-md drop-shadow-md leading-relaxed min-h-[3rem]">
          A monumental circular wall mirror encircled by a wide, hand-pierced solid brass frame adorned with interlaced Islamic star patterns and arabesque filigree.
        </p>
        <div id="dashes-container" class="flex justify-center items-center gap-1.5 sm:gap-2 w-full max-w-sm sm:max-w-md px-4 overflow-hidden"></div>
      </div>
    </div>
  </main>

  <script>
    const sliderData = [
      {
            "src": "/assets/images/mirrors/islamic-star-filigree-round-mirror.jpg",
            "title": "ISLAMIC STAR FILIGREE ROUND MIRROR",
            "desc": "A monumental circular wall mirror encircled by a wide, hand-pierced solid brass frame adorned with interlaced Islamic star patterns and arabesque filigree."
      },
      {
            "src": "/assets/images/mirrors/organic-fluid-brass-mirror.jpg",
            "title": "ORGANIC FLUID BRASS MIRROR",
            "desc": "A contemporary statement mirror sculpted in an organic, asymmetrical fluid silhouette with a minimalist brushed solid brass contour bezel."
      },
      {
            "src": "/assets/images/mirrors/faceted-octagonal-brass-mirror.jpg",
            "title": "FACETED OCTAGONAL BRASS MIRROR",
            "desc": "An architectural wall mirror set within a substantial, hand-finished solid brass frame featuring bold chamfered bevels and clean mitered geometry."
      },
      {
            "src": "/assets/images/mirrors/botanical-laurel-branch-brass-mirror.jpg",
            "title": "BOTANICAL LAUREL BRANCH BRASS MIRROR",
            "desc": "A circular decorative wall mirror embraced by a sculptural, hand-forged solid brass laurel vine with delicate hand-carved leaves blossoming along the rim."
      },
      {
            "src": "/assets/images/mirrors/mandala-brass-mirror-gallery-collection.jpg",
            "title": "MANDALA BRASS MIRROR GALLERY COLLECTION",
            "desc": "A curated salon ensemble of seven hand-engraved circular solid brass mirrors, each showcasing distinct geometric mandalas and classical filigree motifs."
      },
      {
            "src": "/assets/images/mirrors/mirror-01.jpg?v=2",
            "title": "ISLAMIC STAR GEOMETRIC BRASS MIRROR",
            "desc": "A circular mirror encompassed by an intricate hand-cut solid brass border featuring Islamic eight-point star geometric fretwork."
      },
      {
            "src": "/assets/images/mirrors/mirror-02.jpg",
            "title": "SCALLOPED BRASS INLAY MIRROR",
            "desc": "An architectural tall mirror framed in solid brass with handcrafted artisan fish-scale brass inlays and aged patina."
      },
      {
            "src": "/assets/images/mirrors/mirror-03.jpg",
            "title": "TUBULAR OVAL BRASS MIRROR",
            "desc": "A pill-shaped mirror encased in concentric solid brass tubular bands with a hand-brushed satin luster."
      },
      {
            "src": "/assets/images/mirrors/mirror-04.jpg",
            "title": "PIERCED GEOMETRIC BRASS MIRROR",
            "desc": "A square wall mirror enveloped by hand-pierced solid brass geometric latticework reflecting authentic Egyptian metalcraft."
      },
      {
            "src": "/assets/images/mirrors/mirror-05.jpg",
            "title": "SCULPTED BRASS LEAF MIRROR",
            "desc": "An organic silhouette mirror adorned with a hand-cast and chased solid brass botanical palm leaf relief."
      },
      {
            "src": "/assets/images/mirrors/mirror-06.jpg",
            "title": "ORGANIC CAST BRASS BRANCH MIRROR",
            "desc": "A sculptural circular mirror enveloped by hand-chiseled organic branch web motifs in polished solid brass."
      },
      {
            "src": "/assets/images/mirrors/mirror-07.jpg",
            "title": "RADIANT BRASS SUNBURST BRANCH MIRROR",
            "desc": "A statement sunburst wall mirror featuring hand-forged solid brass branches radiating with sculptural architectural energy."
      },
      {
            "src": "/assets/images/mirrors/mirror-08.jpg",
            "title": "FILIGREE BRASS SCROLLWORK MIRROR",
            "desc": "An artisanal round mirror surrounded by layered solid brass petals embellished with delicate hand-spun wire filigree scrollwork."
      },
      {
            "src": "/assets/images/mirrors/mirror-09.jpg",
            "title": "TEXTURED BRASS STUDDED HALO MIRROR",
            "desc": "A circular convex halo mirror enveloped by a multi-tiered constellation of hand-hammered solid brass nailheads and tactile pins."
      }
];

    let currentIndex = 0;
    const titleEl = document.getElementById('slider-title');
    const descEl = document.getElementById('slider-desc');
    const imgEl = document.getElementById('slider-image');
    const dashesContainer = document.getElementById('dashes-container');
    const prevBtn = document.getElementById('prev-btn');
    const nextBtn = document.getElementById('next-btn');

    // Build Dash indicators dynamically
    sliderData.forEach((_, idx) => {
      const dash = document.createElement('span');
      dash.className = `dash-dot flex-1 max-w-[24px] min-w-[6px] h-[2px] rounded-full transition-all duration-300 cursor-pointer ${idx === 0 ? 'bg-white' : 'bg-white/30'}`;
      dash.addEventListener('click', () => updateSlider(idx));
      dashesContainer.appendChild(dash);
    });

    function updateSlider(index) {
      if (index < 0) {
        currentIndex = sliderData.length - 1;
      } else if (index >= sliderData.length) {
        currentIndex = 0;
      } else {
        currentIndex = index;
      }

      // Smooth crossfade
      imgEl.style.opacity = '0.3';
      titleEl.style.opacity = '0.3';
      descEl.style.opacity = '0.3';

      setTimeout(() => {
        imgEl.src = sliderData[currentIndex].src;
        imgEl.alt = sliderData[currentIndex].title;
        titleEl.innerText = sliderData[currentIndex].title;
        descEl.innerText = sliderData[currentIndex].desc;

        imgEl.style.opacity = '1';
        titleEl.style.opacity = '1';
        descEl.style.opacity = '1';

        // Update dashes
        const dots = dashesContainer.querySelectorAll('.dash-dot');
        dots.forEach((dot, idx) => {
          if (idx === currentIndex) {
            dot.classList.remove('bg-white/30');
            dot.classList.add('bg-white');
          } else {
            dot.classList.remove('bg-white');
            dot.classList.add('bg-white/30');
          }
        });
      }, 150);
    }

    if (prevBtn) {
      prevBtn.addEventListener('click', () => updateSlider(currentIndex - 1));
    }
    if (nextBtn) {
      nextBtn.addEventListener('click', () => updateSlider(currentIndex + 1));
    }

    // Keyboard navigation
    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowLeft') updateSlider(currentIndex - 1);
      if (e.key === 'ArrowRight') updateSlider(currentIndex + 1);
    });

    // Touch swipe support
    let touchStartX = 0;
    let touchEndX = 0;
    const container = document.querySelector('main');

    if (container) {
      container.addEventListener('touchstart', (e) => {
        touchStartX = e.changedTouches[0].screenX;
      }, { passive: true });

      container.addEventListener('touchend', (e) => {
        touchEndX = e.changedTouches[0].screenX;
        const diff = touchEndX - touchStartX;
        if (Math.abs(diff) > 40) {
          if (diff < 0) {
            updateSlider(currentIndex + 1);
          } else {
            updateSlider(currentIndex - 1);
          }
        }
      }, { passive: true });
    }
  </script>

</body>
</html>
