    // Read initial product from URL if present: ?product=...-item-2 or ?item=2
        const urlParams = new URLSearchParams(window.location.search);
        const productParam = urlParams.get('product') || urlParams.get('item');
        let initialIndex = 0;
        if (productParam) {
          const match = productParam.match(/-item-(\d+)$/i);
          const parsedIdx = match ? (parseInt(match[1], 10) - 1) : (parseInt(productParam, 10) - 1);
          if (!isNaN(parsedIdx) && parsedIdx >= 0 && parsedIdx < sliderData.length) {
            initialIndex = parsedIdx;
          }
        }
        let currentIndex = initialIndex;
    const titleEl = document.getElementById('slider-title');
    const descEl = document.getElementById('slider-desc');
    const imgEl = document.getElementById('slider-image');
    const sourceDesktopEl = document.getElementById('slider-source-desktop');
    const dashesContainer = document.getElementById('dashes-container');
    const prevBtn = document.getElementById('prev-btn');
    const nextBtn = document.getElementById('next-btn');

    // Build Dash indicators dynamically
    sliderData.forEach((_, idx) => {
      const dash = document.createElement('span');
      dash.className = `dash-dot flex-1 max-w-[24px] min-w-[6px] h-[2px] rounded-full transition-all duration-300 cursor-pointer ${idx === currentIndex ? 'bg-[#D7C797] active' : 'bg-[#D7C797]/30'}`;
      dash.addEventListener('click', () => updateSlider(idx));
      dashesContainer.appendChild(dash);
        });
    
        function syncSlide(idx) {
      const isDesktop = window.matchMedia('(min-width: 1024px)').matches;
      const currentItem = sliderData[idx];
      if (sourceDesktopEl) {
        sourceDesktopEl.srcset = (isDesktop && currentItem.desktopSrc) ? currentItem.desktopSrc : currentItem.src;
      }
      imgEl.src = (isDesktop && currentItem.desktopSrc) ? currentItem.desktopSrc : currentItem.src;
      imgEl.alt = currentItem.title;
      titleEl.innerText = currentItem.title;
      descEl.innerText = currentItem.desc;
    }

    if (currentIndex >= 0 && sliderData[currentIndex]) {
      syncSlide(currentIndex);
    }

    function updateSlider(index) {
      if (index < 0) {
        currentIndex = sliderData.length - 1;
      } else if (index >= sliderData.length) {
        currentIndex = 0;
      } else {
        currentIndex = index;
      }

      // Smooth crossfade
      imgEl.style.opacity = '0.3';
      titleEl.style.opacity = '0.3';
      descEl.style.opacity = '0.3';

      setTimeout(() => {
        const isDesktop = window.matchMedia('(min-width: 1024px)').matches;
        const currentItem = sliderData[currentIndex];
        if (sourceDesktopEl) {
          sourceDesktopEl.srcset = currentItem.desktopSrc || currentItem.src;
        }
        imgEl.src = (isDesktop && currentItem.desktopSrc) ? currentItem.desktopSrc : currentItem.src;
        imgEl.alt = currentItem.title;
        titleEl.innerText = currentItem.title;
        descEl.innerText = currentItem.desc;

        imgEl.style.opacity = '1';
        titleEl.style.opacity = '1';
        descEl.style.opacity = '1';

        // Update dashes
        const dots = dashesContainer.querySelectorAll('.dash-dot');
        dots.forEach((dot, idx) => {
          if (idx === currentIndex) {
            dot.classList.remove('bg-[#D7C797]/30', 'bg-white', 'bg-white/30');
          dot.classList.add('bg-[#D7C797]', 'active');
          } else {
            dot.classList.remove('bg-[#D7C797]', 'bg-white');
          dot.classList.remove('active');
          dot.classList.add('bg-[#D7C797]/30');
          }
        });
      }, 150);
    }

    if (prevBtn) {
      prevBtn.addEventListener('click', () => updateSlider(currentIndex - 1));
    }
    if (nextBtn) {
      nextBtn.addEventListener('click', () => updateSlider(currentIndex + 1));
    }

    // Keyboard navigation
    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowLeft') updateSlider(currentIndex - 1);
      if (e.key === 'ArrowRight') updateSlider(currentIndex + 1);
    });

    // Touch swipe support
    let touchStartX = 0;
    let touchEndX = 0;
    const container = document.querySelector('main');

    if (container) {
      container.addEventListener('touchstart', (e) => {
        touchStartX = e.changedTouches[0].screenX;
      }, { passive: true });

      container.addEventListener('touchend', (e) => {
        touchEndX = e.changedTouches[0].screenX;
        const diff = touchEndX - touchStartX;
        if (Math.abs(diff) > 40) {
          if (diff < 0) {
            updateSlider(currentIndex + 1);
          } else {
            updateSlider(currentIndex - 1);
          }
        }
      }, { passive: true });
    }
  
    // Share button interaction (dynamic SSG product link)
    const shareBtn = document.getElementById('share-btn');
    if (shareBtn) {
      shareBtn.addEventListener('click', async (e) => {
        e.preventDefault();
        const title = (typeof titleEl !== 'undefined' && titleEl) ? titleEl.innerText : document.title;
        
        // Extract category slug from URL
        const path = window.location.pathname;
        const match = path.match(/\/([a-z0-9-]+)(?:\.html)?$/i);
        const categorySlug = match ? match[1] : 'lighting';
        
        // Determine active product ID based on current slide
        const currentItem = (typeof sliderData !== 'undefined' && sliderData[currentIndex]) ? sliderData[currentIndex] : null;
        const activeProductId = (currentItem && currentItem.id) ? currentItem.id : `${categorySlug}-item-${(typeof currentIndex !== 'undefined' ? currentIndex : 0) + 1}`;
        
        // Construct specific SSG share URL
        const shareUrl = window.location.origin + '/products/' + activeProductId + '/';

        if (navigator.share) {
          try {
            await navigator.share({ title: title, url: shareUrl });
          } catch (err) {}
        } else if (navigator.clipboard) {
          await navigator.clipboard.writeText(shareUrl);
          shareBtn.classList.add('text-white', 'scale-110');
          setTimeout(() => shareBtn.classList.remove('text-white', 'scale-110'), 1500);
        }
      });
    }

    // Direct WhatsApp Product Inquiry Button (With Rich Link Card Preview)
    const productWaBtn = document.getElementById('product-wa-btn');
    if (productWaBtn) {
      productWaBtn.addEventListener('click', (e) => {
        e.preventDefault();
        
        // Extract category slug from URL
        const path = window.location.pathname;
        const match = path.match(/\/([a-z0-9-]+)(?:\.html)?$/i);
        let categorySlug = match ? match[1].toLowerCase() : 'lighting';
        if (categorySlug === 'index' || !categorySlug) categorySlug = 'lighting';

        const currentItem = (typeof sliderData !== 'undefined' && sliderData[currentIndex]) 
          ? sliderData[currentIndex] 
          : (typeof masterpiecesData !== 'undefined' && masterpiecesData[currentIndex])
          ? masterpiecesData[currentIndex]
          : (typeof filmsData !== 'undefined' && filmsData[currentIndex])
          ? filmsData[currentIndex]
          : null;
        const title = (currentItem && currentItem.title) || (typeof titleEl !== 'undefined' && titleEl ? titleEl.innerText : document.title);
        
        // Determine active product ID and full product link (Produces Rich Preview with Picture in WhatsApp)
        const activeProductId = (currentItem && currentItem.id) ? currentItem.id : `${categorySlug}-item-${(typeof currentIndex !== 'undefined' ? currentIndex : 0) + 1}`;
        const productUrl = `${window.location.origin}/products/${activeProductId}/`;

        // Track Conversion Events
        if (typeof window.fbq === 'function') {
          window.fbq('track', 'Contact', { content_name: title, content_category: 'WhatsApp Product Inquiry' });
        }
        if (typeof window.gtag === 'function') {
          window.gtag('event', 'generate_lead', { event_category: 'WhatsApp', event_label: title });
        }

        const waText = `مرحباً ورشة تراث، أود الاستفسار عن تفصيل وسعر هذه القطعة:\n${title}\n${productUrl}`;
        window.open('https://wa.me/201016771010?text=' + encodeURIComponent(waText), '_blank', 'noopener,noreferrer');
      });
    }

    // Surgical Image & Media Protection
    document.addEventListener('contextmenu', (e) => {
      if (e.target.closest('img, video, [data-protected-media], #slider-image, #masterpiece-img, .video-stream')) {
        e.preventDefault();
        return false;
      }
    }, { capture: true });

    document.addEventListener('dragstart', (e) => {
      if (e.target.closest('img, video, [data-protected-media], #slider-image, #masterpiece-img, .video-stream')) {
        e.preventDefault();
        return false;
      }
    }, { capture: true });


  

        // Premium Knockout Preloader: Synchronized Asset, Font & Layout Ready
    function initPreloaderDismissal() {
      const preloader = document.getElementById('luxury-preloader');
      if (!preloader || preloader.dataset.dismissed === 'true') return;

      function dismiss() {
        if (preloader.dataset.dismissed === 'true') return;
        preloader.dataset.dismissed = 'true';
        requestAnimationFrame(() => {
          preloader.style.opacity = '0';
          preloader.style.pointerEvents = 'none';
          setTimeout(() => {
            if (preloader.parentNode) preloader.parentNode.removeChild(preloader);
          }, 1000);
        });
      }

      // Mandatory Safety Fallback: Guarantee dismissal within 1800ms under any network condition
      const safetyTimeout = setTimeout(dismiss, 1800);

      const mainMedia = document.getElementById('slider-image') || document.getElementById('slider-video') || document.getElementById('masterpiece-img');

      const mediaReadyPromise = new Promise((resolve) => {
        if (!mainMedia) return resolve();
        if (mainMedia.tagName && mainMedia.tagName.toLowerCase() === 'video') {
          if (mainMedia.readyState >= 2) return resolve();
          mainMedia.addEventListener('loadeddata', () => resolve(), { once: true });
          mainMedia.addEventListener('canplay', () => resolve(), { once: true });
          setTimeout(resolve, 800);
          return;
        }
        if (mainMedia.complete && mainMedia.naturalWidth > 0) {
          if (mainMedia.decode) {
            mainMedia.decode().then(resolve).catch(resolve);
          } else {
            resolve();
          }
        } else {
          mainMedia.addEventListener('load', () => {
            if (mainMedia.decode) mainMedia.decode().then(resolve).catch(resolve);
            else resolve();
          }, { once: true });
          mainMedia.addEventListener('error', resolve, { once: true });
          setTimeout(resolve, 1000);
        }
      });

      const minDisplayPromise = new Promise((resolve) => setTimeout(resolve, 1000));
      const fontsPromise = (document.fonts && document.fonts.ready) ? document.fonts.ready : Promise.resolve();

      Promise.all([mediaReadyPromise, minDisplayPromise, fontsPromise]).then(() => {
        clearTimeout(safetyTimeout);
        dismiss();
      });
    }

    if (document.readyState === 'complete') {
      initPreloaderDismissal();
    } else {
      window.addEventListener('load', initPreloaderDismissal);
      document.addEventListener('DOMContentLoaded', () => {
        setTimeout(initPreloaderDismissal, 2000);
      });
    }
  </script>

  <script>
    window.addEventListener('pageshow', function (event) {
      if (event.persisted) {
        const preloader = document.getElementById('luxury-preloader') || document.getElementById('preloader');
        if (preloader) {
          preloader.style.opacity = '0';
          preloader.style.display = 'none';
        }
      }
    });
  </script>
